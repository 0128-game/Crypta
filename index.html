<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CRYPTA</title>

    <link rel="stylesheet" href="css/common.css">
</head>

<body>

    <header>
        <h1>CRYPTA</h1>
        <p>暗号通信セキュリティ・シミュレーション</p>
    </header>

    <main>

        <section id="intro">
            <h2>暗号通信を設計しよう</h2>

            <p>
                AliceとBobの通信を自分で設計し、
                EveやMalloryから通信を守ろう。
            </p>

            <button id="startButton" type="button">
                ゲームを開始
            </button>
        </section>

        <section id="stageSelect">
            <h2>ステージ選択</h2>

            <div id="stageList">

                <button type="button" data-stage="1">
                    Stage 1
                </button>

                <button type="button" data-stage="2" disabled>
                    Stage 2
                </button>

                <button type="button" data-stage="3" disabled>
                    Stage 3
                </button>

                <button type="button" data-stage="4" disabled>
                    Stage 4
                </button>

                <button type="button" data-stage="5" disabled>
                    Stage 5
                </button>

                <button type="button" data-stage="6" disabled>
                    Stage 6
                </button>

                <button type="button" data-stage="7" disabled>
                    Stage 7
                </button>

                <button type="button" data-stage="8" disabled>
                    Stage 8
                </button>

                <button type="button" data-stage="9" disabled>
                    Stage 9
                </button>

                <button type="button" data-stage="10" disabled>
                    Stage 10
                </button>

                <button type="button" data-stage="11" disabled>
                    Stage 11
                </button>

                <button type="button" data-stage="12" disabled>
                    Stage 12
                </button>

            </div>
        </section>

    </main>

    <footer>
        <p>CRYPTA</p>
    </footer>

    <script src="js/index.js"></script>

</body>
</html>
