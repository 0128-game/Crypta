<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CRYPTA - Simulator</title>

    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/simulator.css">
</head>

<body>

    <header>
        <h1>CRYPTA</h1>
        <p>暗号通信セキュリティ・シミュレーション</p>
    </header>

    <main id="simulator">

        <!-- ステージ情報 -->
        <section id="stageInfo">
            <h2 id="stageTitle">Stage 1</h2>
            <p id="stageDescription"></p>
        </section>

        <!-- 目標 -->
        <section id="objectives">
            <h2>目標</h2>

            <div id="finalObjective">
                <h3>最終目標</h3>
                <p id="finalObjectiveText"></p>
            </div>

            <div id="objectiveA">
                <h3>Objective A</h3>
                <p id="objectiveAText"></p>
            </div>

            <div id="objectiveB">
                <h3>Objective B</h3>
                <p id="objectiveBText"></p>
            </div>
        </section>

        <!-- 攻撃者情報 -->
        <section id="attackerInfo">
            <h2>攻撃者</h2>

            <div id="attackers">
                <!-- Eve / Mallory は必要なステージのみJSで生成 -->
            </div>
        </section>

        <!-- 通信設計 -->
        <section id="communicationDesign">
            <h2>通信を設計する</h2>

            <div id="communicationArea">

                <div id="alice" class="character">
                    <h3>Alice</h3>
                </div>

                <div id="communicationPath">
                    <!-- 通信ブロックをここに配置 -->
                </div>

                <div id="bob" class="character">
                    <h3>Bob</h3>
                </div>

            </div>

            <div id="components">
                <h3>使用可能なコンポーネント</h3>

                <div id="componentList">
                    <!-- 使用可能なコンポーネントをJSで生成 -->
                </div>
            </div>
        </section>

        <!-- シミュレーション -->
        <section id="simulation">
            <h2>シミュレーション</h2>

            <div id="simulationArea">
                <!-- シミュレーション内容をJSで表示 -->
            </div>

            <button id="simulateButton" type="button">
                シミュレーション開始
            </button>
        </section>

        <!-- 結果 -->
        <section id="result" class="hidden">
            <h2>結果</h2>

            <div id="resultMessage"></div>

            <div id="evaluation">
                <h3>評価</h3>
                <p id="evaluationRank"></p>
                <p id="evaluationReason"></p>
            </div>
        </section>

    </main>

    <footer>
        <p>CRYPTA</p>
    </footer>

    <script src="js/simulator.js"></script>

</body>
</html>
