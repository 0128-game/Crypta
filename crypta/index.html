<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CRYPTA | 今送ったその情報、本当に大丈夫？</title>
  <meta name="description" content="AliceとBobの通信を自分で設計し、EveとMalloryの攻撃から守る。暗号と情報セキュリティを体験で学ぶシミュレーションゲーム。">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="page-index">

  <a class="skip-link" href="#stage-section">ステージ一覧へ移動</a>

  <header class="site-header">
    <a class="site-logo" href="index.html" aria-label="CRYPTA トップへ">CRYPTA</a>
    <div class="site-header-right">
      <button type="button" class="button button-secondary button-quiet" id="reset-all">全ステージをリセット</button>
      <p class="site-progress" id="progress" aria-live="polite"></p>
    </div>
  </header>

  <main>

    <!-- ヒーロー -->
    <section class="hero" aria-labelledby="hero-title">
      <h1 id="hero-title">今送ったその情報、<br>本当に大丈夫？</h1>
      <p class="hero-lead">
        パスワードも、送金も、メッセージも、
        相手に届くまでに、いくつもの機器を通ります。
        その途中で、盗み見るEve、書き換えるMalloryがいたら。
        AliceとBobの通信を自分の手で組み立てて、攻撃を受けながら、暗号のしくみを学ぼう。
      </p>
    </section>

    <!-- つづきから（ヒーローの下に、横長の行を、1つ） -->
    <section class="continue" id="continue-section" aria-label="つづきから">
      <ul class="stage-list" id="continue-list"></ul>
    </section>

    <!-- ステージ一覧（js/index.js が #stage-list にカードを挿入する） -->
    <section class="stages" id="stage-section" aria-labelledby="stages-title">
      <h2 id="stages-title">ステージ</h2>
      <p class="stages-status" id="stage-status" role="status">ステージを読み込み中…</p>
      <ul class="stage-list" id="stage-list"></ul>
      <noscript>
        <p class="stages-status">ステージ一覧の表示には JavaScript が必要です。</p>
      </noscript>
    </section>

  </main>

  <footer class="site-footer">
    <p id="footer-text">CRYPTA は暗号と情報セキュリティを学ぶための教材ゲームです。</p>
  </footer>

  <script type="module" src="js/index.js"></script>
</body>
</html>
