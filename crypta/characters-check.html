<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CRYPTA | キャラクター画像のチェック</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/characters-check.css">
  <link rel="stylesheet" href="css/theme.css">
</head>
<body class="page-chars">
  <header class="site-header">
    <a class="site-logo" href="index.html" aria-label="CRYPTA トップへ">CRYPTA</a>
    <a class="header-link" href="characters-tool.html">画像の自動整形</a>
  </header>

  <main class="chars-main">
    <h1>キャラクター画像のチェック</h1>
    <p class="chars-lead">
      <code>assets/characters/</code> に置いた画像が、ちゃんと読み込めるか、大きさや背景は、問題ないかを、確かめるページです。
      画像を置いたら、ブラウザを、強制再読み込み（Ctrl+Shift+R）してから、開いてください。
    </p>
    <p class="chars-summary" id="summary" role="status">調べています…</p>
    <div class="chars-advice" id="advice" hidden></div>

    <h2>画像1枚ずつの、チェック</h2>
    <div class="chars-grid" id="grid"></div>

    <h2>ゲームの中での、見え方</h2>
    <p class="chars-lead">実際に、ゲームの中で、使われる大きさです（左: Alice のゾーン、中: 公開ゾーン、右: Bob のゾーン の色）。画像がないキャラは、ゲームに入っている絵（SVG）が、出ます。</p>
    <div class="chars-ingame" id="ingame"></div>
  </main>

  <script type="module" src="js/characters-check.js"></script>
</body>
</html>
