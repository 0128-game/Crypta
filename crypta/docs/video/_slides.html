<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><title>slides</title>
<link rel="stylesheet" href="css/common.css"><link rel="stylesheet" href="css/theme.css">
<style>
 html,body{margin:0;width:1280px;height:720px;overflow:hidden}
 body{display:flex;align-items:center;justify-content:center}
 .slide{width:1280px;height:720px;box-sizing:border-box;padding:56px 72px;display:flex;flex-direction:column;justify-content:center}
 .logo{font-family:var(--font-mono);font-weight:800;letter-spacing:.14em;font-size:34px;background:var(--sun);border:3px solid var(--ink);display:inline-block;padding:4px 18px;border-radius:4px;align-self:flex-start}
 h1{font-size:76px;line-height:1.3;margin:28px 0 18px;font-weight:800}
 .sub{font-size:32px;color:var(--ink-soft);font-weight:700;margin:0}
 .band{background:var(--sun);border:3px solid var(--ink);border-radius:4px;padding:56px 72px;width:100%;box-sizing:border-box}
 h2{font-size:48px;margin:0 0 36px;font-weight:800}
 .character .face-bad{display:none} .character{display:block}
 .cast{display:grid;grid-template-columns:repeat(4,1fr);gap:28px}
 .card{background:var(--surface);border:3px solid var(--ink);border-radius:4px;padding:20px 14px 18px;text-align:center}
 .card .who{font-size:34px;font-weight:800;margin:6px 0 4px}
 .card .role{font-size:24px;color:var(--ink-soft);font-weight:700}
 .card .char{display:flex;justify-content:center}
 .card.eve{border-color:var(--eve)} .card.mallory{border-color:var(--mallory)} .card.alice{border-color:var(--alice)} .card.bob{border-color:var(--bob)}
 .flow{display:flex;align-items:stretch;gap:20px}
 .step{flex:1;background:var(--surface);border:3px solid var(--ink);border-radius:4px;padding:28px 22px}
 .step b{display:block;font-family:var(--font-mono);font-size:30px;margin-bottom:10px}
 .step p{font-size:30px;font-weight:800;margin:0;line-height:1.5}
 .step small{display:block;margin-top:10px;font-size:22px;color:var(--ink-soft);font-weight:600;line-height:1.5}
 .arrow{align-self:center;font-size:52px;font-weight:800}
 .groups{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
 .g{background:var(--surface);border:3px solid var(--ink);border-radius:4px;padding:18px 22px}
 .g h3{font-size:28px;margin:0 0 10px;padding-bottom:6px;border-bottom:3px solid var(--ink)}
 .g li{font-size:23px;font-weight:700;line-height:1.7;list-style:none;padding:0}
 .g li span{display:inline-block;width:34px;font-family:var(--font-mono);color:var(--ink-soft)}
 .q{font-size:64px;font-weight:800;line-height:1.4;background:var(--ink);color:var(--surface);padding:40px 48px;border-radius:4px}
 .url{font-family:var(--font-mono);font-size:30px;margin-top:30px;font-weight:700}
</style></head><body>
<div id="root"></div>
<script type="module">
import { makeCharacter } from './js/characters.js';
const titles = await (await fetch('/_stage_titles.json')).json();
const s = new URLSearchParams(location.search).get('s');
const root = document.getElementById('root');
const html = {
 title: `<div class="slide"><span class="logo">CRYPTA</span><h1>今送ったその情報、<br>本当に大丈夫？</h1><p class="sub">暗号を、自分で組んで守る、セキュリティ体験ゲーム</p></div>`,
 cast: `<div class="slide"><h2>Alice が、Bob に送る。その途中で…</h2><div class="cast">
   <div class="card alice"><div class="char" id="c1"></div><div class="who">Alice</div><div class="role">メッセージを送る</div></div>
   <div class="card bob"><div class="char" id="c2"></div><div class="who">Bob</div><div class="role">受け取る</div></div>
   <div class="card eve"><div class="char" id="c3"></div><div class="who">Eve</div><div class="role">盗み見る</div></div>
   <div class="card mallory"><div class="char" id="c4"></div><div class="who">Mallory</div><div class="role">書き換える</div></div></div></div>`,
 loop: `<div class="slide"><h2>ステージごとに、同じ流れで、学ぶ</h2><div class="flow">
   <div class="step"><b>1</b><p>事件が起きる</p><small>前の回路が、新しい攻撃で、破られる</small></div><div class="arrow">→</div>
   <div class="step"><b>2</b><p>守りを組む</p><small>部品を置いて、線でつなぐ</small></div><div class="arrow">→</div>
   <div class="step"><b>3</b><p>攻撃にぶつける</p><small>Eve と Mallory が、実際に攻撃する</small></div></div></div>`,
 stages: `<div class="slide"><h2>12のステージで、暗号の基本から、TLS まで</h2><div class="groups">
   <div class="g"><h3>暗号化</h3><ul>${[1,2,3,4].map(i=>`<li><span>${i}</span>${titles[i]}</li>`).join('')}</ul></div>
   <div class="g"><h3>認証・改ざん対策</h3><ul>${[5,6,7,8,9].map(i=>`<li><span>${i}</span>${titles[i]}</li>`).join('')}</ul></div>
   <div class="g"><h3>実際の通信技術</h3><ul>${[10,11].map(i=>`<li><span>${i}</span>${titles[i]}</li>`).join('')}<li><span>12</span>エピローグ</li></ul></div></div></div>`,
 end: `<div class="slide"><span class="logo">CRYPTA</span><div class="q" style="margin-top:34px">あなたの通信、<br>本当に大丈夫ですか？</div><div class="url">https://0128-game.github.io/Crypta/crypta/index.html</div></div>`,
};
root.innerHTML = html[s] ?? html.title;
if (s === 'cast') [['c1','alice'],['c2','bob'],['c3','eve'],['c4','mallory']].forEach(([id,k]) => document.getElementById(id).append(makeCharacter(k, { width: 190, height: 243 })));
document.body.dataset.ready = '1';
</script></body></html>
