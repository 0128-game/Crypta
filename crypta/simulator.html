<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CRYPTA | シミュレータ</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/simulator.css">
</head>
<body class="page-simulator">

  <a class="skip-link" href="#board">通信を設計する場所へ移動</a>

  <header class="site-header">
    <a class="site-logo" href="index.html" aria-label="CRYPTA トップへ">CRYPTA</a>
    <a class="header-link" href="index.html#stage-section">ステージ一覧</a>
  </header>

  <!-- エディタ: キャンバスを全面に広げ、条件・ボタン・部品をその上に重ねる -->
  <main class="editor" id="editor">

    <p class="sim-status" id="sim-status" role="status">ステージを読み込み中…</p>

    <!-- ステージが読み込めたら simulator.js が hidden を外す -->
    <div id="sim-root" hidden>

      <!-- キャンバス（全面） -->
      <div class="board" id="board" tabindex="-1">
        <!-- 何もないところをドラッグすると、この world ごと動く -->
        <div class="world" id="world">
          <svg class="edges" id="edges" aria-hidden="true"></svg>
        </div>
      </div>

      <!-- 左上: ステージの条件と、シミュレーション結果（結果が出るときは条件を畳む） -->
      <div class="side-stack" id="side-stack">

        <aside class="brief-panel" id="brief-panel" aria-label="ステージの条件">
          <div class="brief-bar">
            <h1 id="stage-title"></h1>
            <div class="brief-buttons">
              <button type="button" class="brief-toggle brief-guide" id="guide-open" hidden>解説</button>
              <!-- 用語集は、別のタブで開く -->
              <a class="brief-toggle brief-glossary" id="glossary-link" href="glossary.html" target="_blank" rel="noopener">用語集</a>
              <button type="button" class="brief-toggle" id="brief-toggle" aria-expanded="true" aria-controls="brief-body">隠す</button>
            </div>
          </div>
          <div class="brief-body" id="brief-body">
            <p class="brief-goal" id="stage-goal"></p>

            <section class="brief-group" id="attacker-group" aria-labelledby="attacker-title">
              <div class="brief-group-head">
                <h2 id="attacker-title">攻撃者</h2>
                <button type="button" class="term" data-term="env">環境とは？</button>
              </div>
              <div class="brief-badges" id="attacker-badges"></div>
              <dl class="caps" id="attacker-caps"></dl>
            </section>

            <section class="brief-group" aria-labelledby="objective-title">
              <h2 id="objective-title">目標</h2>
              <ol class="objectives" id="objective-list"></ol>
            </section>
          </div>
        </aside>

        <!-- シミュレーション結果 -->
        <section class="result" id="result" hidden aria-live="polite" tabindex="-1"></section>

      </div>

      <!-- 右上: 操作ボタン -->
      <div class="toolbar" id="toolbar">
        <button type="button" class="button button-secondary" id="solution-button" hidden title="想定解（模範の組み立て方）を、キャンバスに置きます">想定解</button>
        <button type="button" class="button button-secondary" id="reset-button">やり直す</button>
        <button type="button" class="button button-primary" id="run-button">シミュレーション開始</button>
      </div>

      <!-- 下: 凡例と部品一覧（部品はグループごとのタブで切り替える） -->
      <div class="palette-bar" id="palette-bar">
        <ul class="legend" id="legend" aria-label="データの色と、その意味"></ul>
        <div class="palette-tabs" id="palette-tabs" role="tablist" aria-label="部品の種類"></div>
        <div class="palette" id="palette"></div>
      </div>

      <!-- 新しい条件が出たときなどのお知らせ -->
      <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

      <!-- チュートリアル: 次にやることを、1つずつ案内する -->
      <div class="coach" id="coach" hidden role="status" aria-live="polite">
        <p class="coach-step" id="coach-step"></p>
        <p class="coach-text" id="coach-text"></p>
      </div>

    </div>
  </main>

  <!-- 用語の説明（文中の下線つきの言葉・「?」ボタンで、いまの画面の上に重ねて出る） -->
  <div class="guide term-dialog" id="term-dialog" hidden role="dialog" aria-modal="true" aria-labelledby="term-title">
    <div class="guide-card">
      <div class="guide-head">
        <div>
          <p class="term-cat" id="term-cat"></p>
          <h2 id="term-title"></h2>
        </div>
        <button type="button" class="guide-close" id="term-close" aria-label="説明を閉じる">×</button>
      </div>
      <div class="guide-body" id="term-body"></div>
      <div class="guide-foot">
        <!-- ほかの用語を読みたいときは、別のタブの用語集へ -->
        <a class="button button-secondary" id="term-glossary" href="glossary.html" target="_blank" rel="noopener">用語集へ</a>
        <button type="button" class="button button-primary" id="term-done">とじる</button>
      </div>
    </div>
  </div>

  <!-- ステージの解説（最初に開いたとき・「解説」ボタンで出る） -->
  <div class="guide" id="guide" hidden role="dialog" aria-modal="true" aria-labelledby="guide-title">
    <div class="guide-card">
      <div class="guide-head">
        <h2 id="guide-title"></h2>
        <button type="button" class="guide-close" id="guide-close" aria-label="解説を閉じる">×</button>
      </div>
      <div class="guide-body" id="guide-body"></div>
      <div class="guide-foot">
        <button type="button" class="button button-primary" id="guide-start">あそぶ</button>
      </div>
    </div>
  </div>

  <!-- 読み込み失敗の診断用: スクリプトが動かないとき、画面にエラーを出す -->
  <script>
    (function () {
      function show(msg) {
        var s = document.getElementById('sim-status');
        if (!s) return;
        s.hidden = false;
        s.classList.add('is-error');
        s.textContent = msg;
      }
      window.addEventListener('error', function (e) {
        var t = e.target;
        if (t && t.tagName === 'SCRIPT') {
          show('スクリプトを読み込めませんでした: ' + t.src + '（パスと、ファイル名の大文字小文字を確認してください）');
        } else {
          show('エラーが起きました: ' + e.message + '（F12 でコンソールを開くと詳細が見られます）');
        }
      }, true);
    })();
  </script>
  <script type="module" src="js/simulator.js"></script>
</body>
</html>
