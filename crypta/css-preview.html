<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRYPTA CSS プレビュー</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; font: 14px/1.5 "BIZ UDPGothic","Yu Gothic UI","Hiragino Kaku Gothic ProN","Meiryo",system-ui,sans-serif; color: #263650; background: #e9e5da; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 8px 14px; background: #263650; color: #fffcf5; }
  .bar h1 { margin: 0; font-size: 15px; letter-spacing: .06em; }
  .bar .grp { display: flex; gap: 4px; align-items: center; }
  .bar button, .bar label.btn { padding: 4px 10px; font: 700 12px/1.4 inherit; color: #263650; background: #fffcf5; border: 2px solid #fffcf5; border-radius: 4px; cursor: pointer; }
  .bar button.on { background: #f3c63f; border-color: #f3c63f; }
  .bar button:hover, .bar label.btn:hover { background: #f3c63f; }
  .bar .sp { flex: 1; }
  #status { font-size: 12px; opacity: .85; }
  .main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(300px, 36%) 1fr; }
  .editor { display: flex; flex-direction: column; min-height: 0; border-right: 2px solid #263650; background: #fffcf5; }
  .editor .hint { margin: 0; padding: 8px 12px; font-size: 12px; color: #657085; border-bottom: 1px solid #cfc9b8; }
  #picked { padding: 6px 12px; font: 600 12px/1.5 ui-monospace, Consolas, monospace; background: #f3c63f; min-height: 30px; word-break: break-all; }
  textarea { flex: 1; min-height: 0; width: 100%; padding: 12px; font: 12.5px/1.6 ui-monospace, "SF Mono", Consolas, "BIZ UDGothic", monospace; color: #263650; background: #fffcf5; border: 0; outline: 0; resize: none; tab-size: 2; white-space: pre; overflow: auto; }
  .preview { min-height: 0; overflow: auto; padding: 14px; }
  .pv { margin: 0 auto 22px; background: #fffcf5; border: 2px solid #263650; }
  .pv > h2 { margin: 0; padding: 5px 12px; font-size: 13px; color: #fffcf5; background: #263650; }
  .pv iframe { display: block; width: 100%; border: 0; background: #fff; }
  @media (max-width: 900px) { .main { grid-template-columns: 1fr; grid-template-rows: 42% 1fr; } .editor { border-right: 0; border-bottom: 2px solid #263650; } }
</style>
</head>
<body>
<div class="bar">
  <h1>CRYPTA CSS プレビュー</h1>
  <div class="grp"><span>画面の幅:</span>
    <button data-w="390">スマホ 390</button><button data-w="768">タブレット 768</button><button data-w="1280" class="on">PC 1280</button><button data-w="0">いっぱい</button></div>
  <div class="grp"><button id="reset">元に戻す</button><button id="copy">コピー</button><button id="save">保存（theme.css）</button><label class="btn">CSS を読み込む<input type="file" id="load" accept=".css,text/css" hidden></label></div>
  <span class="sp"></span><span id="status">左の CSS を書き換えると、右に、すぐ、反映されます。</span>
</div>
<div class="main">
  <div class="editor">
    <p class="hint">左は <b>css/theme.css</b> の内容です。書き換えると、右の部品に、すぐ、反映されます（ゲームの、ほかの CSS は、そのまま）。右の部品を、クリックすると、その部品の、クラス名が出て、CSS の、その場所が、選ばれます。気に入ったら、「保存」または「コピー」して、<b>css/theme.css</b> を、置き換えてください。</p>
    <div id="picked">（右の部品を、クリックしてください）</div>
    <textarea id="css" spellcheck="false">/* ==========================================================
   CRYPTA theme.css  — 見た目の、まとめ（最後に読み込む）
   方針: 「紙のような温かさ × 深い藍色 × 少しレトロな情報技術」
     ・地は、生成り。骨組み（線・文字）は、深い藍。主役の色は、黄色だけ。
     ・キャラクターは、それぞれ、決まった色（Alice＝青、Bob＝青緑、Eve＝くすんだ青紫、Mallory＝紅）
     ・影は、つけない。うすい色（パステル）も、使わない。
     ・線は、細め（1〜2px）。角は、少しだけ丸い（4px）。
   色や形を変えたいときは、まず、下の「トークン」を、書き換える。
   ========================================================== */

:root {
  /* 地・面・文字 */
  --bg: #F2EEE4;            /* 生成り（ページの地） */
  --surface: #FFFCF5;       /* パネルの、温かみのある白 */
  --ink: #263650;           /* 深い藍（線・見出し・文字） */
  --ink-soft: #657085;      /* 灰色寄りの藍（説明文） */
  --line: #263650;

  /* ブランド（黄色は、主役。くすませない） */
  --sun: #F3C63F;
  --gold: #D9AF3D;

  /* キャラクターの色（固定） */
  --alice: #53679B;
  --bob: #347C79;
  --eve: #747093;
  --mallory: #A65361;

  /* 役割の色 */
  --primary: var(--alice);
  --primary-deep: var(--ink);
  --ok: #3F8A5C;            /* 成功・完了 */
  --danger: var(--mallory); /* 注意・エラー */

  /* うすい色は、使わない（面の色は、白か、生成り） */
  --primary-soft: var(--surface);
  --eve-soft: var(--surface);
  --mallory-soft: var(--surface);
  --sun-soft: var(--surface);
  --ok-soft: var(--surface);

  /* 角・影 */
  --r-lg: 4px;
  --r-md: 4px;
  --r-pill: 4px;
  --shadow-soft: none;
  --shadow-lift: none;

  /* 区切りに使う、薄い面と、細い線（枠線は、主役だけ。ほかは、面の色で、分ける） */
  --paper-deep: #E8E2D3;
  --hair: rgba(38, 54, 80, 0.22);

  /* 線の太さ */
  --bw: 2px;
  --bw-s: 1.5px;

  /* 書体 */
  --font: "BIZ UDPGothic", "Yu Gothic UI", "Hiragino Kaku Gothic ProN", "Meiryo", system-ui, sans-serif;
  --font-mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, "BIZ UDGothic", monospace;
}

/* ---------- 影・ぼかしは、なし ---------- */
*, *::before, *::after {
  box-shadow: none !important;
  text-shadow: none !important;
  -webkit-backdrop-filter: none !important;
  backdrop-filter: none !important;
}
.character .glow, .attacker-figure, .node-figure, svg.character { filter: none !important; }
svg path, svg circle, svg rect, svg g, svg line { filter: none !important; }

/* ---------- 全体（本文は 16px を基準） ---------- */
html { font-size: 16px; }
body {
  color: var(--ink);
  background-color: var(--bg);
  background-image: radial-gradient(rgba(38, 54, 80, 0.14) 1px, transparent 1.2px);
  background-size: 22px 22px;
  font-weight: 500;
}
h1, h2, h3 { color: var(--ink); font-weight: 800; letter-spacing: 0.01em; }
p, li { color: inherit; }
.stage-goal, .hero-lead, .detail-lead, .chars-lead, .how-to-list p { color: var(--ink-soft); }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; border-radius: 4px; }

/* ---------- ヘッダー ---------- */
.site-logo {
  display: inline-block;
  padding: 0.05rem 0.7rem;
  font-family: var(--font-mono);
  font-size: 1.3rem;
  font-weight: 800;
  letter-spacing: 0.14em;
  color: var(--ink);
  background: var(--sun);
  border: var(--bw) solid var(--ink);
  border-radius: 4px;
}
.header-link {
  padding: 0 0.2rem;
  font-weight: 700;
  color: var(--ink);
  background: transparent;
  border-radius: 0;
  text-decoration: underline;
  text-decoration-thickness: 2px;
  text-underline-offset: 4px;
  text-decoration-color: var(--gold);
}
.header-link:hover { background: var(--sun); }
.site-progress { color: var(--ink); background: var(--surface); border: var(--bw-s) solid var(--ink); border-radius: 4px; font-weight: 700; }

/* ---------- ボタン（メイン = 黄色の塗り、サブ = 白＋藍の線） ---------- */
.button {
  border: var(--bw) solid var(--ink);
  border-radius: 4px;
  transition: background 0.08s, color 0.08s;
}
.button-primary { color: var(--ink); background: var(--sun); }
.button-secondary { color: var(--ink); background: var(--surface); padding: 0.85rem 2rem; }
.button:hover { transform: none; color: var(--surface); background: var(--ink); }
.button:active { transform: translateY(1px); }
.button[disabled] { opacity: 0.45; }
.button[disabled]:hover { color: var(--ink); background: var(--surface); }
/* 控えめなボタン（やり直す・想定解・事件を見る など） */
.button-quiet { padding: 0.4rem 0.9rem; font-size: 0.85rem; font-weight: 700; border-width: var(--bw-s); }

/* ---------- バッジ・ラベル ---------- */
.badge { border: var(--bw-s) solid var(--ink); border-radius: 4px; font-weight: 700; }
.badge-eve { color: #fff; background: var(--eve); }
.badge-mallory { color: #fff; background: var(--mallory); }

/* ---------- トップページ ---------- */
.hero {
  background: var(--sun);
  border: var(--bw) solid var(--ink);
  border-radius: 4px;
}
.hero::before, .hero::after { display: none; }
.hero h1 { font-weight: 800; letter-spacing: 0; }
.hero-lead { color: var(--ink); font-weight: 600; }
.hero .button-primary { color: var(--surface); background: var(--ink); }
.hero .button-primary:hover { color: var(--ink); background: var(--surface); }

/* 「遊び方」と「ステージ」は、同じ、カードの見た目 */
.how-to-list li, .how-to-note, .stage-card {
  background: var(--surface);
  border: var(--bw) solid var(--ink);
  border-radius: 4px;
}
.how-to-list li::before { border-radius: 4px; }
.stage-card:not(.is-locked):hover { background: var(--sun); }
.stage-card.is-locked { background: transparent; border-style: dashed; border-color: var(--ink-soft); color: var(--ink-soft); }
.stage-card.is-cleared { border-left-width: var(--bw); }  /* 緑の太い縦線は、やめた。クリアは、右上の小さな表示で示す */
.stage-card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.4rem; }
.stage-number { font-family: var(--font-mono); font-size: 0.8rem; font-weight: 800; color: var(--ink); background: transparent; border: var(--bw-s) solid var(--ink); border-radius: 4px; }
.stage-title { font-size: 1.3rem; font-weight: 800; line-height: 1.4; }   /* 学習内容（タイトル）が、主役 */
.stage-card.is-locked .stage-number { border-style: dashed; }
.stage-clear, .stage-ex, .stage-rating, .rating {
  padding: 0 0.5rem;
  font-size: 0.78rem;
  font-weight: 800;
  line-height: 1.6;
  color: var(--ink);
  background: transparent;
  border: var(--bw-s) solid var(--ink);
  border-radius: 4px;
}
/* 学習内容の、まとまりの見出し */
.stage-group { grid-column: 1 / -1; margin-top: 0.8rem; }
.stage-group:first-child { margin-top: 0; }
.stage-group h3 { padding-bottom: 0.25rem; font-size: 1rem; font-weight: 800; color: var(--ink); border-bottom: var(--bw) solid var(--ink); }

/* ---------- シミュレーター: パネル ---------- */
.brief-panel, .palette-bar, .result, .guide-card, .toast, .coach, .sim-status, .zone-log {
  background: var(--surface);
  border: var(--bw) solid var(--ink);
  border-radius: 4px;
}
.demo-banner { color: var(--surface); background: var(--ink); border: var(--bw) solid var(--ink); border-radius: 4px; }
.demo-banner.is-bad { background: var(--mallory); color: #fff; }
.demo-banner.is-safe { background: var(--ok); color: #fff; }
.sim-status.is-error { color: #fff; background: var(--mallory); }

/* チュートリアルの案内: 作業する場所（まん中）を、隠さない。右下に、固定する */
.coach {
  left: auto;
  right: 0.75rem;
  bottom: 0.75rem;
  width: min(340px, 32vw);
  padding: 0.7rem 1rem 0.8rem;
  border-color: var(--gold);
  border-width: var(--bw);
  transform: none;
}
.coach-step { color: var(--ink-soft); }
.coach-text { font-size: 0.95rem; }
@media (max-width: 1000px) { .coach { top: 4.4rem; bottom: auto; width: min(340px, 60vw); } }

/* ---------- ゾーン: うすい斜線と、細い壁 ---------- */
.zone-alice, .zone-bob { background: transparent; border: 0; }
.zone-public {
  background: repeating-linear-gradient(135deg, rgba(38, 54, 80, 0.07) 0 1px, transparent 1px 14px);
  border: 0;
}
.zone-public.is-breached { background: repeating-linear-gradient(135deg, rgba(166, 83, 97, 0.35) 0 2px, transparent 2px 14px); }
.zone-public.is-safe { background: repeating-linear-gradient(135deg, rgba(63, 138, 92, 0.35) 0 2px, transparent 2px 14px); }
.zone-wall {
  background: var(--ink-soft);
  border-left: var(--bw) solid var(--ink);
  border-right: var(--bw) solid var(--ink);
}
.zone-wall.is-broken {
  background: repeating-linear-gradient(0deg, transparent 0 16px, var(--ink-soft) 16px 22px, transparent 22px 38px);
  border-color: transparent;
  opacity: 0.55;
}
.wall-gate rect { fill: var(--surface); stroke: var(--ink); stroke-width: 2.5; }
.zone-tag { padding: 0.1rem 0.8rem; font-weight: 800; border: var(--bw-s) solid var(--ink); border-radius: 4px; background: var(--surface); color: var(--ink); }
.zone-tag-alice { color: #fff; background: var(--alice); }
.zone-tag-public { color: var(--ink); background: var(--surface); border-style: dashed; }
.zone-tag-bob { color: #fff; background: var(--bob); }

/* ボード */
.board {
  background-color: var(--bg);
  background-image: radial-gradient(rgba(38, 54, 80, 0.2) 1.2px, transparent 1.4px);
  background-size: 24px 24px;
}
/* 「通信の道」の案内（線が、まだ、1本もないとき） */
.guide-line { fill: none; stroke: var(--ink-soft); stroke-width: 3; stroke-dasharray: 2 11; stroke-linecap: round; opacity: 0.6; }
.guide-text { font-size: 15px; font-weight: 800; fill: var(--ink-soft); text-anchor: middle; }

/* ---------- 操作ボタンの、重要度 ---------- */
.toolbar #run-button { padding: 0.7rem 1.6rem; font-size: 1rem; }
.manual-toggle { display: inline-flex; align-items: center; gap: 0.35rem; padding: 0.2rem 0.5rem; font-size: 0.85rem; font-weight: 700; color: var(--ink-soft); background: transparent; border: 0; }

/* ---------- 部品（ブロック）: 中は、白。種類は、線の色で、見分ける ---------- */
.node, .node-channel, .node-encrypt, .node-decrypt, .node-key, .node-alicepair, .node-bobpair,
.node-hash, .node-hashcheck, .node-mac, .node-maccheck, .node-sign, .node-verify, .node-ca, .node-certcheck,
.node-tls, .node-tlsopen, .node-handkey, .node-alicepub, .node-alicepriv, .node-bobpub, .node-bobpriv, .node-seqstamp, .node-seqcheck {
  background: var(--surface);
  border-width: var(--bw);
  border-radius: 4px;
}
.node-alice { border-color: var(--alice); min-width: 215px; }
.node-bob { border-color: var(--bob); min-width: 215px; }
.node-alice .node-title, .node-bob .node-title { font-size: 1.05rem; }
.node-encrypt, .node-decrypt, .node-tls, .node-tlsopen { border-color: var(--alice); }
.node-key, .node-handkey { border-color: var(--eve); }
/* 鍵ペアは、持ち主の色（Alice = 青、Bob = 青緑）。ひと目で、どちらの鍵か、分かる */
.node-alicepair, .node-alicepub, .node-alicepriv { border-color: var(--alice); }
.node-bobpair, .node-bobpub, .node-bobpriv { border-color: var(--bob); }
.node-hash, .node-hashcheck, .node-mac, .node-maccheck { border-color: var(--bob); }
.node-sign, .node-verify, .node-ca, .node-certcheck, .node-seqstamp, .node-seqcheck { border-color: var(--gold); }
.node.is-pair { border-color: var(--pair, var(--eve)); }
/* 公開ゾーンに置かれた部品: 点線の枠で、「誰にでも、見える」ことを、示す */
.node[data-zone="public"] { outline: 2px dashed var(--ink); outline-offset: 3px; }
/* 状態: 影ではなく、枠線で見せる */
.node.is-active { outline: 3px solid var(--sun); outline-offset: 2px; }
.node.is-received { outline: 3px solid var(--ok); outline-offset: 2px; }
.node.is-garbled, .node.is-blocked { outline: 3px solid var(--mallory); outline-offset: 2px; }
.node.is-warn { outline: 3px dashed var(--mallory); outline-offset: 2px; }
.port.is-target { outline: 3px solid var(--sun); outline-offset: 2px; }
.tutorial-target { outline: 3px solid var(--sun); outline-offset: 3px; }

.palette-item, .brief-toggle, .segmented, .palette-tab, .switch-btn {
  border: var(--bw-s) solid var(--ink);
  border-radius: 4px;
}
.palette-item { background: var(--surface); transition: background 0.08s; }
.palette-item span { font-size: 0.82rem; color: var(--ink-soft); }
.palette-item:hover { background: var(--sun); }
.palette-tab { color: var(--ink); background: var(--surface); }
.palette-tab.is-active, .switch-btn.is-active { color: var(--surface); background: var(--ink); }
.brief-toggle { color: var(--ink); background: var(--surface); }
.brief-toggle:hover { background: var(--sun); }
.brief-toggle.brief-guide { color: var(--ink); background: var(--sun); }
.brief-toggle.brief-guide:hover { color: var(--surface); background: var(--ink); }
.brief-toggle.brief-glossary { color: var(--ink); background: var(--surface); }
.port { border-width: 2px; }
.term-chip:hover, .see-chip:hover { background: var(--sun); }
.legend { font-size: 0.85rem; }

/* 起きていること */
.situation li { color: var(--ink); background: var(--surface); border: var(--bw-s) solid var(--ink); border-left: 6px solid var(--mallory); border-radius: 4px; font-weight: 700; }
.situation li::before { display: none; }

/* ---------- 吹き出し ---------- */
.attacker-bubble, .node-bubble { border: var(--bw) solid var(--ink); border-radius: 4px; background: var(--surface); color: var(--ink); }
.attacker-bubble.is-think, .node-bubble.tone-plain { background: var(--surface); border-style: dashed; color: var(--ink); }
.attacker-bubble.tone-bad, .node-bubble.tone-bad { color: #fff; background: var(--mallory); border-color: var(--mallory); }
.attacker-bubble.tone-good, .node-bubble.tone-good { color: #fff; background: var(--ok); border-color: var(--ok); }
.attacker-bubble.tone-bad *, .node-bubble.tone-bad *, .attacker-bubble.tone-good *, .node-bubble.tone-good * { color: #fff; }
.attacker-name { border: var(--bw-s) solid var(--ink); border-radius: 4px; font-weight: 800; font-family: var(--font-mono); }
.attacker[data-who="eve"] .attacker-name { color: #fff; background: var(--eve); }
.attacker[data-who="mallory"] .attacker-name { color: #fff; background: var(--mallory); }

/* ---------- ラベル・小さな札 ---------- */
.chip, .rule-chip, .palette-tag { border: var(--bw-s) solid var(--ink); border-radius: 4px; font-size: 0.8rem; }

/* ---------- 事件の、結果 ---------- */
.demo-verdict { border: var(--bw) solid var(--ink); border-radius: 4px; }
.demo-verdict.is-bad { color: #fff; background: var(--mallory); border-color: var(--mallory); }
.demo-verdict.is-safe { color: #fff; background: var(--ok); border-color: var(--ok); }
.demo-dialog .guide-section.demo-bad h3 { color: var(--mallory); }
.demo-dialog .guide-section.demo-safe h3 { color: var(--ok); }
.epilogue-question { border: var(--bw) solid var(--ink); border-radius: 4px; background: var(--ink); color: var(--surface); }

/* ---------- 用語集 ---------- */
.glossary-nav, .glossary-detail, .detail-card {
  background: var(--surface);
  border: var(--bw) solid var(--ink);
  border-radius: 4px;
}
.glossary-search { border: var(--bw) solid var(--ink); border-radius: 4px; background: #fff; }

/* ---------- 画像のチェック・整形ツール ---------- */
.chars-card, .chars-summary, .tool-settings { border: var(--bw) solid var(--ink); border-radius: 4px; background: var(--surface); }
.chars-summary.is-ok { color: #fff; background: var(--ok); }
.chars-summary.is-ng { color: #fff; background: var(--mallory); }
.chars-advice { background: var(--surface); border: var(--bw) solid var(--ink); border-left: 8px solid var(--sun); border-radius: 4px; }
.chars-main code { background: var(--surface); border: var(--bw-s) solid var(--ink); border-radius: 4px; }
.chars-badges li { border: var(--bw-s) solid var(--ink); border-radius: 4px; }
.chars-badges .ok { color: #fff; background: var(--ok); }
.chars-badges .warn { color: var(--ink); background: var(--sun); }
.chars-badges .ng { color: #fff; background: var(--mallory); }
.tool-drop { border: var(--bw) dashed var(--ink); border-radius: 4px; background: var(--surface); }
.tool-drop.is-over, .tool-drop:hover, .tool-drop:focus-visible { background: var(--sun); border-color: var(--ink); }
.chars-thumb { border: var(--bw-s) solid var(--ink); }
.tool-slot { border: var(--bw-s) solid var(--ink); border-radius: 4px; }
.chars-zones .z-alice, .chars-zones .z-bob { background: var(--surface); }
.chars-zones .z-public { background: repeating-linear-gradient(135deg, rgba(38, 54, 80, 0.07) 0 1px, transparent 1px 14px), var(--surface); }
.chars-zones { border: var(--bw) solid var(--ink); }

/* 「次へ」「エピローグを始める」ボタンは、ホバー・クリックしても、位置が、動かない */
.next-step:hover, .next-step:active, .epilogue-start:hover, .epilogue-start:active { transform: none; }

@media (prefers-reduced-motion: reduce) {
  .button, .stage-card, .palette-item { transition: none; }
}

/* クリア済みのカードも、ふつうの枠線（緑の色は、使わない） */
.stage-card.is-cleared { border-color: var(--ink); background: var(--surface); }
.stage-card.is-cleared:hover { background: var(--sun); }
.how-to-note { color: var(--ink); font-weight: 700; }

/* 条件パネル: ステージ名と、ボタンは、1行に、収める（ボタンは、小さめ） */
.brief-bar { flex-wrap: nowrap; gap: 0.5rem; }
.brief-bar #stage-title { flex: 1 1 auto; min-width: 0; font-size: 1.1rem; line-height: 1.35; }
.brief-buttons { flex: none; gap: 0.3rem; }
.brief-toggle { padding: 0.2rem 0.55rem; font-size: 0.8rem; font-weight: 700; }

/* ---------- 文字の、最終調整: 画面で、11px より、小さくならないように ---------- */
.node-title { font-size: 0.98rem; }
.node .port-label, .port-label { font-size: 0.88rem; }
.algo-desc { font-size: 0.85rem; max-width: 15rem; line-height: 1.5; }
.pair-badge { font-size: 0.85rem; }
.node select { font-size: 0.9rem; }
.node-alice, .node-bob { min-width: 230px; }

/* 通知: 白い地に、藍の文字（白い文字が、消えないように） */
.toast, .toast.is-note, .toast.is-error { color: var(--ink); background: var(--surface); }
.toast.is-error { color: #fff; background: var(--mallory); }
/* 組の印: 文字が、見えるように、色を、少し、濃く */
.pair-badge { color: #fff; font-weight: 800; }
.node.is-pair .pair-badge { background: var(--pair, var(--eve)); }


/* ==========================================================
   引き算: 枠線を、主役だけに、してあります
   ・枠線（2px の濃い藍）が、残るのは: ロゴ・ヒーロー・メインボタン・ブロック（部品）だけ
   ・カード・バッジ・タグ・パネルは、枠線なし。白（--surface）と、濃い紙（--paper-deep）の、面の違いで、分ける
   ・補足（タグ・状態・評価）は、主張を、弱くする。主役（見出し・メインのボタン）だけが、目に入るように
   ========================================================== */

/* ---- トップページ ---- */
.how-to-list li, .how-to-note, .stage-card { border: 0; }
.stage-card { background: var(--surface); }
.stage-card:not(.is-locked):hover { background: var(--sun); }
.stage-card.is-cleared { border: 0; background: var(--surface); }
.stage-card.is-locked { border: 0; background: var(--paper-deep); opacity: 0.55; }
.stage-number { padding: 0; font-size: 0.78rem; font-weight: 700; color: var(--ink-soft); background: transparent; border: 0; }
.stage-clear, .stage-ex, .stage-rating, .rating, .stage-now { border: 0; color: var(--ink-soft); background: var(--paper-deep); }
.stage-title { font-size: 1.15rem; }
.stage-goal { color: var(--ink-soft); font-size: 0.9rem; }
.site-progress { border: 0; background: var(--paper-deep); color: var(--ink-soft); }
.button-secondary { border: 0; background: var(--paper-deep); }
.button-secondary:hover { color: var(--surface); background: var(--ink); }
.button-secondary[disabled]:hover { color: var(--ink); background: var(--paper-deep); }
.hero .button-secondary { background: var(--surface); }
/* 主役: いま遊べる、次のステージだけ、2倍の幅で、黄色。クリア済みは、控えめ */
.stage-list > li.is-current-li { grid-column: span 2; }
.stage-card.is-current { padding: 1.8rem 1.8rem 2rem; background: var(--sun); }
.stage-card.is-current:hover { background: #F7D460; }
.stage-card.is-current .stage-title { font-size: 1.9rem; line-height: 1.3; }
.stage-card.is-current .stage-goal { color: var(--ink); font-size: 1rem; font-weight: 600; }
.stage-card.is-current .stage-number { color: var(--ink); }
.stage-now { padding: 0 0.6rem; font-size: 0.78rem; font-weight: 800; color: var(--surface); background: var(--ink); }
@media (max-width: 640px) { .stage-list > li.is-current-li { grid-column: auto; } }

/* ---- 小さな札（タグ・バッジ・チップ）は、枠線なし。補足なので、控えめ ---- */
.badge, .chip, .rule-chip, .palette-tag, .zone-tag, .attacker-name, .term-chip { border: 0; }
.badge-eve, .badge-mallory { color: var(--ink); background: var(--paper-deep); }
.badge-eve::before, .badge-mallory::before { background: currentColor; }
.badge-eve { color: var(--eve); }
.badge-mallory { color: var(--mallory); }
.chip, .rule-chip, .palette-tag { color: var(--ink-soft); background: var(--paper-deep); }
.zone-tag { background: var(--paper-deep); color: var(--ink); }
.zone-tag-alice { color: #fff; background: var(--alice); }
.zone-tag-bob { color: #fff; background: var(--bob); }
.zone-tag-public { color: var(--ink); background: var(--surface); }

/* ---- ゲーム画面のパネル: 枠線は、ごく細く（ボードの上に、浮いているので、境目だけ） ---- */
.brief-panel, .palette-bar, .result, .guide-card, .toast, .sim-status, .zone-log { border: 1px solid var(--hair); }
.coach { border: 0; border-left: 5px solid var(--gold); }
.demo-banner { border: 0; }
.demo-verdict { border: 0; }
.situation li { border: 0; border-left: 5px solid var(--mallory); background: var(--paper-deep); }
.palette-item, .brief-toggle, .segmented, .palette-tab, .switch-btn { border: 0; background: var(--paper-deep); }
.palette-item:hover, .brief-toggle:hover { background: var(--sun); }
.palette-tab.is-active, .switch-btn.is-active { color: var(--surface); background: var(--ink); }
.brief-toggle.brief-guide { background: var(--sun); }
.attacker-bubble, .node-bubble { border: 0; background: var(--paper-deep); }
.attacker-bubble.is-think, .node-bubble.tone-plain { background: transparent; border: 1.5px dashed var(--ink-soft); }
.attacker-bubble.tone-bad, .node-bubble.tone-bad { background: var(--mallory); }
.attacker-bubble.tone-good, .node-bubble.tone-good { background: var(--ok); }
.attacker-name { color: #fff; }
.toolbar .button-quiet { border: 0; }
.manual-toggle { color: var(--ink-soft); }
.epilogue-question { border: 0; }

/* ---- 用語集・画像の道具 ---- */
.glossary-nav, .glossary-detail, .detail-card { border: 0; }
.glossary-search { border: 1px solid var(--hair); }
.chars-card, .chars-summary, .tool-settings, .chars-advice { border: 0; }
.chars-advice { border-left: 6px solid var(--sun); }
.chars-main code { border: 0; background: var(--paper-deep); }
.chars-badges li { border: 0; }
.tool-drop { border: 2px dashed var(--ink-soft); }
.chars-thumb, .chars-zones { border: 1px solid var(--hair); }
.tool-slot { border: 1px solid var(--hair); }

/* ロック中の番号: 四角の面は、なし（文字だけ、うすく） */
.stage-card.is-locked .stage-number { padding: 0; color: var(--ink-soft); background: transparent; border: 0; }
.stage-card.is-locked .stage-title, .stage-card.is-locked .stage-goal { color: var(--ink-soft); }
/* 評価・クリアの札: 番号と、同じ高さの、ふつうの小さな札 */
.stage-card .stage-card-head .rating, .stage-card .stage-card-head .stage-clear { padding: 0 0.5rem; font-size: 0.78rem; line-height: 1.7; }

/* ==========================================================
   第2回の引き算（デザイン原則どおり、枠線は、主役と、入力部品だけ）
   ・ゲーム画面のパネルは、枠線なし。白（--surface）と、ボードの地（--bg）の、面の違いだけで、分ける
   ・ブロックの枠は、種類を示す色のまま、細く（1.5px）
   ・小さな丸ボタン・データの札は、枠なし。薄い面だけ
   ・主役は、1画面に、1〜2点: 「シミュレーション開始」と、いま遊ぶステージ
   ========================================================== */
.brief-panel, .palette-bar, .result, .guide-card, .toast, .sim-status, .zone-log, .brief-panel.is-collapsed { border: 0; }
.node { border-width: 1.5px; }
.node-packet { border: 0; background: var(--paper-deep); }
.node-help, .node-remove, .result-close { border: 0; background: var(--paper-deep); }
.node-help:hover, .node-remove:hover, .result-close:hover { color: var(--surface); background: var(--ink); }
/* 結果の項目: 太い枠で囲まずに、左の色の帯だけ */
.result-objective { border: 0; border-left: 5px solid var(--mallory); border-radius: 4px; background: var(--surface); }
.result-objective.is-met { border: 0; border-left: 5px solid var(--ok); }
/* 解説ボタンは、脇役（黄色は、主役の、シミュレーション開始に、残す） */
.brief-toggle.brief-guide { color: var(--ink); background: var(--paper-deep); }
.brief-toggle.brief-guide:hover { color: var(--surface); background: var(--ink); }
/* 「遊び方」の数字は、色つきの、四角をやめて、ただの数字 */
.how-to-list li::before { width: auto; height: auto; padding: 0; font-family: var(--font-mono); font-size: 1.5rem; font-weight: 800; color: var(--ink-soft); background: transparent; border-radius: 0; }
/* タブの、選択中は、反転を弱める */
.palette-tab.is-active, .switch-btn.is-active { color: var(--surface); background: var(--ink-soft); }

/* ==========================================================
   トップページ: ステージは、横長の、リスト（1行に、1ステージ）
   ・目立たせるのは、2つだけ: ヒーロー（黄色・いちばん大きい）と、続きのステージ（濃い藍・ほかの行より、大きい）
   ・ほかの行は、すべて、同じ見た目（白い行）。クリア済みは、評価だけ。ロック中は、薄く
   ========================================================== */
.stage-list { display: flex; flex-direction: column; gap: 6px; grid-template-columns: none; }
.stage-list > li, .stage-list > li.is-current-li { grid-column: auto; }
.stage-list > li.is-current-li { margin: 0.7rem 0; }
.stage-group { margin-top: 1.8rem; }

.stage-card {
  display: grid;
  grid-template-columns: 3.2rem minmax(0, 1fr) auto auto 1.2rem;
  grid-template-areas: "num title tags status arrow" "num goal tags status arrow";
  align-items: center;
  column-gap: 1rem;
  row-gap: 0.1rem;
  height: auto;
  padding: 0.95rem 1.2rem;
  background: var(--surface);
}
.stage-card-head { display: contents; }
.stage-number { grid-area: num; justify-self: center; font-family: var(--font-mono); font-size: 1.25rem; font-weight: 800; color: var(--ink-soft); }
.stage-card-head .rating, .stage-card-head .stage-clear, .stage-card-head .stage-now { grid-area: status; justify-self: end; }
.stage-title { grid-area: title; margin: 0; font-size: 1.1rem; line-height: 1.4; }
.stage-goal, .stage-lock-note { grid-area: goal; margin: 0; font-size: 0.88rem; color: var(--ink-soft); }
.stage-badges { grid-area: tags; display: flex; gap: 0.4rem; flex-wrap: nowrap; margin: 0; }
.stage-card:not(.is-locked)::after { content: "›"; grid-area: arrow; justify-self: end; font-size: 1.7rem; line-height: 1; color: var(--ink-soft); }
.stage-card.is-cleared { background: var(--surface); }
.stage-card.is-locked { background: var(--paper-deep); opacity: 0.5; }
.stage-card.is-locked .stage-title { font-size: 1rem; }

/* 続きのステージ: 濃い藍に、白い文字。ほかの行より、背が高く、見出しが、大きい */
.stage-card.is-current { padding: 1.7rem 1.6rem; background: var(--ink); color: var(--surface); grid-template-columns: 3.6rem minmax(0, 1fr) auto auto 1.4rem; }
.stage-card.is-current:hover { background: #33466b; }
.stage-card.is-current .stage-number { font-size: 2rem; color: var(--sun); }
.stage-card.is-current .stage-title { font-size: 1.9rem; line-height: 1.3; color: var(--surface); }
.stage-card.is-current .stage-goal { color: #D6DAE6; font-size: 1rem; font-weight: 600; }
.stage-card.is-current .stage-now { color: var(--ink); background: var(--sun); }
.stage-card.is-current .badge { color: var(--surface); background: rgba(255, 252, 245, 0.14); }
.stage-card.is-current::after { color: var(--sun); font-size: 2.2rem; }

@media (max-width: 720px) {
  .stage-card { grid-template-columns: 2.2rem minmax(0, 1fr) auto; grid-template-areas: "num title status" "num goal goal" "num tags tags"; padding: 0.9rem 1rem; }
  .stage-card::after { display: none; }
  .stage-card.is-current { grid-template-columns: 2.6rem minmax(0, 1fr) auto; }
  .stage-card.is-current .stage-title { font-size: 1.5rem; }
  .stage-badges { flex-wrap: wrap; margin-top: 0.3rem; }
}
.stage-card .stage-card-head .rating { width: auto; height: auto; min-width: 1.9rem; padding: 0 0.55rem; font-size: 0.85rem; line-height: 1.8; text-align: center; }
