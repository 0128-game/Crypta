<script type="text/plain" id="css-common">/* ==========================================================
   CRYPTA common.css
   index.html / simulator.html 共通
   方針: ライト調・丸っこい・「暗号は難しそう」を崩す
   ========================================================== */


/* ---------- デザイントークン ---------- */
:root {
  /* 色 */
  --bg: #f6f8ff;
  --surface: #ffffff;
  --ink: #263152;
  --ink-soft: #5d6785;
  --line: #e3e8f7;

  --primary: #5468ff;
  --primary-deep: #3a4bdb;
  --primary-soft: #e8ebff;

  --eve: #14a39b;
  --eve-soft: #dcf5f2;
  --mallory: #ee5f78;
  --mallory-soft: #ffe3e8;

  --sun: #ffc94d;
  --sun-soft: #fff1c9;
  --ok: #2bb673;
  --ok-soft: #d9f5e7;

  /* 角丸（3段階だけ使う） */
  --r-lg: 28px;
  --r-md: 20px;
  --r-pill: 999px;

  /* 影 */
  --shadow-soft: 0 6px 20px rgba(84, 104, 255, 0.1);
  --shadow-lift: 0 10px 26px rgba(84, 104, 255, 0.18);

  /* 余白 */
  --gap: 1.25rem;
  --page-width: 960px;

  /* 書体 */
  --font: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "BIZ UDPGothic",
    "Yu Gothic", "Meiryo", system-ui, sans-serif;
}

/* ---------- リセット・ベース ---------- */
*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  font-family: var(--font);
  font-size: 1rem;
  line-height: 1.8;
  color: var(--ink);
  background: var(--bg);
}

h1, h2, h3, p, ul, ol {
  margin: 0;
}

ul, ol {
  padding: 0;
  list-style: none;
}

a {
  color: inherit;
}

img, svg {
  max-width: 100%;
  display: block;
}

:focus-visible {
  outline: 3px solid var(--primary);
  outline-offset: 3px;
  border-radius: 8px;
}

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after {
    transition: none !important;
    animation: none !important;
  }
}

/* ---------- スキップリンク ---------- */
.skip-link {
  position: absolute;
  left: 1rem;
  top: -4rem;
  z-index: 100;
  padding: 0.5rem 1rem;
  background: var(--ink);
  color: #fff;
  border-radius: var(--r-pill);
  text-decoration: none;
}
.skip-link:focus {
  top: 1rem;
}

/* ---------- ヘッダー・フッター ---------- */
.site-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  max-width: var(--page-width);
  margin: 0 auto;
  padding: 1.25rem 1.25rem 0;
}

.site-logo {
  font-size: 1.5rem;
  font-weight: 800;
  letter-spacing: 0.06em;
  text-decoration: none;
  color: var(--primary);
}

.site-progress {
  font-size: 0.9rem;
  font-weight: 700;
  color: var(--primary-deep);
  background: var(--primary-soft);
  padding: 0.25rem 1rem;
  border-radius: var(--r-pill);
}
.site-progress:empty {
  display: none;
}

.site-footer {
  max-width: var(--page-width);
  margin: 4rem auto 0;
  padding: 2rem 1.25rem 3rem;
  text-align: center;
  font-size: 0.85rem;
  color: var(--ink-soft);
}

/* ---------- ボタン ---------- */
.button {
  display: inline-block;
  padding: 0.85rem 2rem;
  font: inherit;
  font-weight: 800;
  line-height: 1.4;
  text-decoration: none;
  text-align: center;
  border: none;
  border-radius: var(--r-pill);
  cursor: pointer;
  transition: transform 0.12s ease, box-shadow 0.12s ease;
}

.button-primary {
  color: #fff;
  background: var(--primary);
  box-shadow: 0 5px 0 var(--primary-deep);
}
.button-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 7px 0 var(--primary-deep);
}
.button-primary:active {
  transform: translateY(4px);
  box-shadow: 0 1px 0 var(--primary-deep);
}

.button-secondary {
  color: var(--primary-deep);
  background: var(--surface);
  box-shadow: 0 5px 0 var(--line);
  border: 2px solid var(--line);
  padding: calc(0.85rem - 2px) calc(2rem - 2px);
}
.button-secondary:hover {
  transform: translateY(-2px);
  box-shadow: 0 7px 0 var(--line);
}
.button-secondary:active {
  transform: translateY(4px);
  box-shadow: 0 1px 0 var(--line);
}

/* ---------- 攻撃者バッジ（simulator でも使う） ---------- */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  padding: 0.1rem 0.75rem;
  font-size: 0.8rem;
  font-weight: 700;
  line-height: 1.7;
  border-radius: var(--r-pill);
}
.badge::before {
  content: "";
  width: 0.55rem;
  height: 0.55rem;
  border-radius: 50%;
  background: currentColor;
}
.badge-eve {
  color: var(--eve);
  background: var(--eve-soft);
}
.badge-mallory {
  color: var(--mallory);
  background: var(--mallory-soft);
}

/* ==========================================================
   index.html 専用（body.page-index 配下）
   ========================================================== */

.page-index main {
  max-width: var(--page-width);
  margin: 0 auto;
  padding: 1.5rem 1.25rem 0;
}

.page-index h2 {
  font-size: 1.5rem;
  font-weight: 800;
  margin-bottom: 1.25rem;
}

/* ---------- ヒーロー ---------- */
.hero {
  position: relative;
  overflow: hidden;
  padding: clamp(2rem, 6vw, 4rem) clamp(1.5rem, 5vw, 3.5rem);
  background: var(--surface);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-soft);
}

/* 飾りの丸（アリス・ボブ・イブを思わせる3つの玉） */
.hero::before,
.hero::after {
  content: "";
  position: absolute;
  border-radius: 50%;
  pointer-events: none;
}
.hero::before {
  width: 17rem;
  height: 17rem;
  right: -5rem;
  top: -5rem;
  background: var(--primary-soft);
}
.hero::after {
  width: 7rem;
  height: 7rem;
  right: 6rem;
  bottom: -2.5rem;
  background: var(--sun-soft);
}

.hero > * {
  position: relative;
  z-index: 1;
}

.hero h1 {
  font-size: clamp(1.9rem, 6vw, 3.2rem);
  font-weight: 800;
  line-height: 1.35;
  letter-spacing: 0.02em;
}

.hero-lead {
  max-width: 32em;
  margin-top: 1.25rem;
  color: var(--ink-soft);
  font-weight: 500;
}

.hero-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 1rem;
  margin-top: 2rem;
}

/* ---------- 遊び方 ---------- */
.how-to {
  margin-top: 3.5rem;
}

.how-to-list {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: var(--gap);
  counter-reset: step;
}

.how-to-list li {
  counter-increment: step;
  padding: 1.5rem;
  background: var(--surface);
  border-radius: var(--r-md);
  box-shadow: var(--shadow-soft);
}

.how-to-list li::before {
  content: counter(step);
  display: grid;
  place-items: center;
  width: 2.5rem;
  height: 2.5rem;
  margin-bottom: 0.75rem;
  font-weight: 800;
  color: #fff;
  background: var(--primary);
  border-radius: 50%;
}
.how-to-list li:nth-child(2)::before {
  background: var(--mallory);
}
.how-to-list li:nth-child(3)::before {
  background: var(--eve);
}

.how-to-list h3 {
  font-size: 1.1rem;
  font-weight: 800;
  margin-bottom: 0.4rem;
}

.how-to-list p {
  font-size: 0.95rem;
  color: var(--ink-soft);
}

.how-to-note {
  margin-top: 1.25rem;
  padding: 0.75rem 1.25rem;
  font-size: 0.95rem;
  font-weight: 700;
  color: #8a6200;
  background: var(--sun-soft);
  border-radius: var(--r-pill);
  text-align: center;
}

/* ---------- ステージ一覧 ---------- */
.stages {
  margin-top: 3.5rem;
  scroll-margin-top: 1rem;
}

.stages-status {
  padding: 1rem 1.25rem;
  color: var(--ink-soft);
  background: var(--surface);
  border-radius: var(--r-md);
}
.stages-status[hidden] {
  display: none;
}
.stages-status.is-error {
  color: #a33145;
  background: var(--mallory-soft);
}

.stage-list {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: var(--gap);
}

.stage-card {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 0.6rem;
  height: 100%;
  padding: 1.25rem 1.25rem 1.4rem;
  color: inherit;
  text-decoration: none;
  background: var(--surface);
  border: 2px solid transparent;
  border-radius: var(--r-md);
  box-shadow: var(--shadow-soft);
  transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
}

a.stage-card:hover {
  transform: translateY(-4px);
  box-shadow: var(--shadow-lift);
  border-color: var(--primary-soft);
}

.stage-card-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.5rem;
}

.stage-number {
  display: grid;
  place-items: center;
  min-width: 2.5rem;
  height: 2.5rem;
  padding: 0 0.6rem;
  font-weight: 800;
  color: var(--primary-deep);
  background: var(--primary-soft);
  border-radius: var(--r-pill);
}

.stage-title {
  font-size: 1.1rem;
  font-weight: 800;
  line-height: 1.5;
}

.stage-goal {
  font-size: 0.9rem;
  color: var(--ink-soft);
}

.stage-badges {
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem;
  margin-top: auto;
  padding-top: 0.4rem;
}

/* 評価チップ */
.rating {
  display: grid;
  place-items: center;
  width: 2.5rem;
  height: 2.5rem;
  font-weight: 800;
  border-radius: 50%;
}
.rating-S { background: var(--sun);  color: #6b4a00; }
.rating-A { background: var(--ok);   color: #fff; }
.rating-B { background: var(--primary); color: #fff; }
.rating-C { background: var(--line); color: var(--ink-soft); }

/* 状態: ロック */
.stage-card.is-locked {
  background: rgba(255, 255, 255, 0.6);
  box-shadow: none;
  border: 2px dashed var(--line);
  color: var(--ink-soft);
  cursor: not-allowed;
}
.stage-card.is-locked .stage-number {
  color: var(--ink-soft);
  background: var(--line);
}
.stage-lock-note {
  font-size: 0.8rem;
  font-weight: 700;
  color: var(--ink-soft);
}

/* 状態: クリア済み */
.stage-card.is-cleared {
  border-color: var(--ok-soft);
}

/* ---------- 小さい画面 ---------- */
@media (max-width: 480px) {
  .hero-actions .button {
    flex: 1 1 100%;
  }
}

/* ステージカードの「クリア」表示（チュートリアル用） */
.stage-clear {
  padding: 0.05rem 0.8rem;
  font-size: 0.8rem;
  font-weight: 800;
  color: #1c8656;
  background: var(--ok-soft);
  border-radius: var(--r-pill);
}

/* EX（やりこみ）をクリアしたしるし */
.stage-ex {
  padding: 0.05rem 0.7rem;
  font-size: 0.75rem;
  font-weight: 800;
  color: #8a6200;
  background: var(--sun-soft);
  border-radius: var(--r-pill);
}
</script>
<script type="text/plain" id="css-simulator">/* ==========================================================
   CRYPTA simulator.css
   simulator.html 専用（トークンは common.css のものを使う）

   画面構成: キャンバスを画面いっぱいに広げ、
   条件パネル・ボタン・部品一覧・結果をその上に重ねる。
   ========================================================== */

:root {
  --plain: #ff8a1f;   /* 元のデータ（暗号化前） */
  --key: #a35cf0;     /* 鍵 */
  --wire: #c6cde8;    /* 電気が通る前の線 */
  --wire-key: #e4d3fa;
  --pubc: #e0a500;   /* 公開鍵 */
  --privc: #c2255c;  /* 秘密鍵・署名 */
  --authc: #0ca678;  /* ハッシュ・MAC */
}

/* ---------- 画面全体 ---------- */
.page-simulator {
  display: flex;
  flex-direction: column;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
}

.page-simulator .site-header {
  flex: none;
  width: 100%;
  max-width: none;
  margin: 0;
  padding: 0.5rem 1rem;
}
.page-simulator .site-logo {
  font-size: 1.25rem;
}
.page-simulator .site-footer {
  display: none;
}

.page-simulator h1 {
  font-size: 1.1rem;
  font-weight: 800;
  line-height: 1.4;
}
.page-simulator h2 {
  font-size: 0.85rem;
  font-weight: 800;
  color: var(--ink-soft);
}

.header-link {
  padding: 0.2rem 1rem;
  font-size: 0.85rem;
  font-weight: 700;
  color: var(--primary-deep);
  text-decoration: none;
  background: var(--primary-soft);
  border-radius: var(--r-pill);
}
.header-link:hover {
  background: #d9deff;
}

.page-simulator .button:disabled {
  opacity: 0.45;
  cursor: not-allowed;
  transform: none;
}

/* ---------- エディタ ---------- */
.editor {
  position: relative;
  flex: 1 1 auto;
  min-height: 0;
  overflow: hidden;
  border-top: 2px solid var(--line);
}

.sim-status {
  position: absolute;
  top: 1rem;
  left: 1rem;
  z-index: 40;
  padding: 1rem 1.25rem;
  color: var(--ink-soft);
  background: var(--surface);
  border-radius: var(--r-md);
  box-shadow: var(--shadow-soft);
}
.sim-status[hidden] { display: none; }
.sim-status.is-error {
  color: #a33145;
  background: var(--mallory-soft);
}

.board {
  position: absolute;
  inset: 0;
  background-color: #fbfcff;
  background-image: radial-gradient(var(--line) 1.5px, transparent 1.5px);
  background-size: 24px 24px;
  outline: none;
  cursor: grab;
  touch-action: none; /* タッチでもキャンバスをドラッグで動かせるように */
}
.board.is-panning {
  cursor: grabbing;
}

/* ノードと線は world に入れ、world ごと動かす */
.world {
  position: absolute;
  inset: 0;
  transform-origin: 0 0; /* 拡大の基準は左上（座標の計算を単純にするため） */
  will-change: transform;
}

/* ---------- 拡大・縮小ボタン ---------- */
.zoom-controls {
  position: absolute;
  top: 4.6rem;
  right: 0.75rem;
  z-index: 20;
  display: flex;
  flex-direction: column;
  gap: 0.35rem;
}
.zoom-controls button {
  width: 2.6rem;
  height: 2.6rem;
  padding: 0;
  font: inherit;
  font-size: 1.1rem;
  font-weight: 800;
  line-height: 1;
  color: var(--primary-deep);
  background: rgba(255, 255, 255, 0.94);
  border: 2px solid var(--primary-soft);
  border-radius: 50%;
  box-shadow: var(--shadow-soft);
  cursor: pointer;
}
.zoom-controls button:hover {
  background: var(--primary-soft);
}
#zoom-label,
#zoom-fit {
  font-size: 0.7rem;
}

/* ---------- 線 ---------- */
.edges {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 1;
  pointer-events: none;
  overflow: visible;
}
.edge-line {
  fill: none;
  stroke-width: 4;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.edge-data .edge-line { stroke: var(--wire); }
.edge-key  .edge-line { stroke: var(--wire-key); stroke-dasharray: 2 8; }

/* 電気が通った部分（色は JS から指定する） */
.edge-energy {
  fill: none;
  stroke-width: 5;
  stroke-linecap: round;
  stroke-linejoin: round;
  pointer-events: none;
}
.edge-hit {
  fill: none;
  stroke: transparent;
  stroke-width: 18;
  pointer-events: stroke;
  cursor: pointer;
}
.edge:hover .edge-line {
  stroke: var(--mallory);
}
.edge-temp {
  fill: none;
  stroke: var(--ink-soft);
  stroke-width: 3;
  stroke-dasharray: 2 8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* ---------- ノード ---------- */
.node {
  --node-pad: 0.75rem;
  --node-border: 2px;
  --port-size: 18px;
  position: absolute;
  z-index: 2;
  width: max-content;
  min-width: 152px;
  max-width: 250px;
  padding: 0.6rem var(--node-pad) 0.75rem;
  background: var(--surface);
  border: var(--node-border) solid var(--ink-soft);
  border-radius: var(--r-md);
  box-shadow: var(--shadow-soft);
  cursor: grab;
  user-select: none;
  touch-action: none;
  transition: box-shadow 0.2s ease, border-color 0.2s ease, background-color 0.2s ease;
}
.node.is-dragging {
  z-index: 5;
  cursor: grabbing;
  box-shadow: var(--shadow-lift);
}

.node-alice,
.node-bob      { width: 150px; border-color: var(--primary-deep); background: var(--primary-soft); }
.node-channel  { width: 236px; border-color: #aab3cf; border-style: dashed; background: #f1f3fa; }
.node-encrypt  { border-color: var(--primary); background: #f3f4ff; }
.node-decrypt  { border-color: var(--ok); background: #effaf4; }
.node-key      { border-color: var(--key); background: #f7f0ff; }

/* シミュレーション中の状態 */
.node.is-active {
  box-shadow: 0 0 0 5px rgba(255, 201, 77, 0.55), var(--shadow-lift);
}
.node.is-blocked {
  border-color: var(--mallory);
  background: var(--mallory-soft);
}
.node.is-received {
  border-color: var(--ok);
  background: var(--ok-soft);
  box-shadow: 0 0 0 5px rgba(43, 182, 115, 0.3);
}
.node.is-garbled {
  border-color: var(--mallory);
  background: var(--mallory-soft);
}
.node-channel.is-breached {
  border-color: var(--mallory);
  border-style: solid;
  background: var(--mallory-soft);
}
.node-channel.is-safe {
  border-color: var(--ok);
  border-style: solid;
  background: var(--ok-soft);
}

.node-head {
  display: flex;
  align-items: center;
  gap: 0.5rem;
}
.node-title {
  flex: 1;
  font-weight: 800;
  line-height: 1.5;
}
.node-avatar {
  flex: none;
  display: grid;
  place-items: center;
  width: 2.2rem;
  height: 2.2rem;
  font-weight: 800;
  color: #fff;
  background: var(--primary-deep);
  border-radius: 50%;
}
.node-remove {
  flex: none;
  display: grid;
  place-items: center;
  width: 1.5rem;
  height: 1.5rem;
  padding: 0;
  font: inherit;
  font-weight: 800;
  line-height: 1;
  color: var(--ink-soft);
  background: rgba(255, 255, 255, 0.8);
  border: 2px solid var(--line);
  border-radius: 50%;
  cursor: pointer;
}
.node-remove:hover {
  color: #fff;
  background: var(--mallory);
  border-color: var(--mallory);
}

.node-algo {
  width: 100%;
  margin-top: 0.4rem;
  padding: 0.2rem 0.5rem;
  font: inherit;
  font-size: 0.8rem;
  font-weight: 700;
  color: var(--ink);
  background: var(--surface);
  border: 2px solid var(--line);
  border-radius: var(--r-pill);
}
.node-algo-fixed {
  display: inline-block;
  margin-top: 0.4rem;
  padding: 0 0.6rem;
  font-size: 0.8rem;
  font-weight: 700;
  background: var(--surface);
  border-radius: var(--r-pill);
}

/* ノードの下に出る「いま持っているデータ」 */
.node-packet,
.tube-packet,
.eve-copy {
  --chip: var(--line);
  display: flex;
  align-items: center;
  gap: 0.4rem;
  min-width: 0;
  padding: 0.1rem 0.6rem;
  font-size: 0.8rem;
  font-weight: 800;
  background: var(--surface);
  border: 2px solid var(--chip);
  border-radius: var(--r-pill);
}
.node-packet {
  margin-top: 0.5rem;
}
.node-packet[hidden],
.eve-copy[hidden] {
  display: none;
}
.packet-dot {
  flex: none;
  width: 0.7rem;
  height: 0.7rem;
  background: var(--chip);
  border-radius: 50%;
}
.packet-text {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  letter-spacing: 0.02em;
}

/* ---------- 通信路の中身 ---------- */
.tube {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.4rem;
  min-height: 2.4rem;
  margin-top: 0.5rem;
  background: var(--surface);
  border: 2px solid var(--line);
  border-radius: var(--r-pill);
}
.tube .port-row {
  margin-top: 0;
}
.tube-packet {
  flex: 1;
  justify-content: center;
  border-width: 2px;
}

.tap-line {
  width: 4px;
  height: 12px;
  margin: 0 auto;
  background: var(--line);
  border-radius: 2px;
  transition: background-color 0.3s ease;
}

.eve-box {
  padding: 0.5rem 0.65rem 0.6rem;
  font-size: 0.78rem;
  background: var(--surface);
  border: 2px solid var(--eve-soft);
  border-radius: var(--r-md);
}
.eve-head {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.4rem;
}
.eve-caps {
  color: var(--ink-soft);
  font-weight: 700;
}
.eve-row {
  display: flex;
  justify-content: space-between;
  gap: 0.5rem;
  margin-top: 0.3rem;
}
.eve-label {
  flex: none;
  color: var(--ink-soft);
}
.eve-value {
  font-weight: 800;
  text-align: right;
  line-height: 1.5;
}
.eve-value.tone-work { color: var(--primary-deep); }
.eve-value.tone-good { color: #1c8656; }
.eve-value.tone-bad  { color: #c63d56; }
.eve-copy {
  margin-top: 0.35rem;
}
.eve-note {
  margin-top: 0.4rem;
  font-size: 0.75rem;
  color: var(--ink-soft);
}

/* ---------- ポート ---------- */
.port-row {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  margin-top: 0.4rem;
  font-size: 0.8rem;
  color: var(--ink-soft);
}
.port-out {
  flex-direction: row-reverse;
}

.port {
  flex: none;
  width: var(--port-size);
  height: var(--port-size);
  padding: 0;
  background: var(--surface);
  border: 3px solid var(--primary);
  border-radius: 50%;
  cursor: crosshair;
  touch-action: none;
}
/* 丸の中心がノードの縁に乗るように、外へはみ出させる */
.port-in .port {
  margin-left: calc(-1 * (var(--node-pad) + var(--node-border) + var(--port-size) / 2));
}
.port-out .port {
  margin-right: calc(-1 * (var(--node-pad) + var(--node-border) + var(--port-size) / 2));
}
.port-type-key {
  border-color: var(--key);
}
.port:hover {
  background: var(--primary-soft);
}
.port.is-target {
  background: var(--sun);
  box-shadow: 0 0 0 4px rgba(255, 201, 77, 0.45);
}
.port.is-pending {
  background: var(--primary);
}

/* ---------- 左上: 条件パネルと結果（縦に積む） ---------- */
.side-stack {
  position: absolute;
  top: 0.75rem;
  left: 0.75rem;
  z-index: 20;
  display: flex;
  flex-direction: column;
  gap: 0.6rem;
  width: min(360px, calc(100% - 1.5rem));
  max-height: calc(100% - 1.5rem - 9rem);
  pointer-events: none; /* すきまはキャンバスを触れるように */
}
.editor.has-result .side-stack {
  max-height: calc(100% - 1.5rem);
}
.side-stack > * {
  pointer-events: auto;
}

.brief-panel {
  display: flex;
  flex-direction: column;
  flex: 0 1 auto;
  min-height: 0;
  background: rgba(255, 255, 255, 0.94);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-lift);
  backdrop-filter: blur(6px);
}

.brief-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.75rem;
  padding: 0.6rem 0.75rem 0.6rem 1.1rem;
}

.brief-toggle {
  flex: none;
  padding: 0.1rem 0.8rem;
  font: inherit;
  font-size: 0.8rem;
  font-weight: 700;
  color: var(--primary-deep);
  background: var(--primary-soft);
  border: none;
  border-radius: var(--r-pill);
  cursor: pointer;
}

.brief-body {
  overflow: auto;
  padding: 0 1.1rem 1rem;
}
.brief-panel.is-collapsed .brief-body {
  display: none;
}

.brief-goal {
  font-size: 0.9rem;
  font-weight: 500;
  color: var(--ink-soft);
  line-height: 1.6;
}

.brief-group {
  margin-top: 0.8rem;
}
.brief-group h2 {
  margin-bottom: 0.3rem;
}

.brief-badges {
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem;
  margin-bottom: 0.4rem;
}

.caps {
  display: grid;
  grid-template-columns: max-content 1fr;
  gap: 0.1rem 0.8rem;
  margin: 0;
  font-size: 0.8rem;
  line-height: 1.6;
}
.caps dt { color: var(--ink-soft); }
.caps dd { margin: 0; font-weight: 700; }

.objectives {
  display: grid;
  gap: 0.6rem;
}
.objective {
  display: flex;
  gap: 0.6rem;
  align-items: flex-start;
}
.objective-mark {
  flex: none;
  display: grid;
  place-items: center;
  width: 1.7rem;
  height: 1.7rem;
  font-size: 0.85rem;
  font-weight: 800;
  color: var(--primary-deep);
  background: var(--primary-soft);
  border-radius: 50%;
}
.objective-title {
  font-size: 0.85rem;
  font-weight: 700;
  line-height: 1.5;
}
.objective-note {
  font-size: 0.78rem;
  line-height: 1.5;
  color: var(--ink-soft);
}

/* ---------- 右上: ボタン ---------- */
.toolbar {
  position: absolute;
  top: 0.75rem;
  right: 0.75rem;
  z-index: 20;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: flex-end;
  gap: 0.6rem;
  max-width: calc(100% - 1.5rem);
}
.toolbar .button {
  padding: 0.5rem 1.2rem;
  font-size: 0.9rem;
}
.toolbar .button-secondary {
  padding: calc(0.5rem - 2px) calc(1.2rem - 2px);
}

.segmented {
  display: flex;
  align-items: center;
  gap: 0.25rem;
  padding: 0.2rem 0.3rem 0.2rem 0.8rem;
  font-size: 0.8rem;
  font-weight: 700;
  color: var(--ink-soft);
  background: rgba(255, 255, 255, 0.94);
  border-radius: var(--r-pill);
  box-shadow: var(--shadow-soft);
}
.segmented[hidden] { display: none; }
.segmented-btn {
  min-width: 2.2rem;
  padding: 0.2rem 0.7rem;
  font: inherit;
  font-weight: 800;
  color: var(--ink-soft);
  background: transparent;
  border: none;
  border-radius: var(--r-pill);
  cursor: pointer;
}
.segmented-btn[aria-pressed="true"] {
  color: #fff;
  background: var(--primary);
}

/* ---------- 下: 凡例と部品一覧 ---------- */
.palette-bar {
  position: absolute;
  bottom: 0.75rem;
  left: 50%;
  z-index: 20;
  width: max-content;
  max-width: calc(100% - 1.5rem);
  padding: 0.6rem 1rem 0.5rem;
  background: rgba(255, 255, 255, 0.94);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-lift);
  backdrop-filter: blur(6px);
  transform: translateX(-50%);
}
.editor.has-result .palette-bar {
  display: none;
}

.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 0.2rem 0.9rem;
  margin-bottom: 0.4rem;
  font-size: 0.75rem;
  font-weight: 700;
  color: var(--ink-soft);
}
.legend li {
  display: flex;
  align-items: center;
  gap: 0.35rem;
}
.legend-dot {
  width: 0.7rem;
  height: 0.7rem;
  background: var(--chip);
  border-radius: 50%;
}

.palette-row {
  display: flex;
  align-items: center;
  gap: 0.75rem;
}
.palette-label {
  flex: none;
  font-size: 0.8rem;
  font-weight: 800;
  color: var(--ink-soft);
}
.palette {
  display: flex;
  gap: 0.6rem;
  overflow-x: auto;
  padding: 0.1rem 0.1rem 0.4rem;
}
.palette-item {
  flex: none;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 0;
  min-width: 7.5rem;
  padding: 0.4rem 0.9rem;
  font: inherit;
  line-height: 1.4;
  color: var(--ink);
  text-align: left;
  background: var(--surface);
  border: 2px solid var(--line);
  border-radius: var(--r-md);
  box-shadow: 0 3px 0 var(--line);
  cursor: grab;
  touch-action: none;
  user-select: none;
  transition: transform 0.12s ease, box-shadow 0.12s ease;
}
.palette-item:hover {
  transform: translateY(-2px);
  box-shadow: 0 5px 0 var(--line);
}
.palette-item:active {
  transform: translateY(2px);
  box-shadow: 0 1px 0 var(--line);
}
.palette-item strong { font-weight: 800; }
.palette-item span {
  font-size: 0.72rem;
  color: var(--ink-soft);
}
.palette-encrypt { border-color: var(--primary); }
.palette-decrypt { border-color: var(--ok); }
.palette-key     { border-color: var(--key); }

.palette-hint {
  font-size: 0.72rem;
  color: var(--ink-soft);
}

.drag-ghost {
  position: fixed;
  z-index: 50;
  padding: 0.5rem 1rem;
  font-weight: 800;
  color: #fff;
  background: var(--primary);
  border-radius: var(--r-pill);
  box-shadow: var(--shadow-lift);
  pointer-events: none;
  transform: translate(-50%, -50%);
}

/* シミュレーション中は、キャンバスと部品一覧を触れなくする */
.editor.is-simulating .node,
.editor.is-simulating .palette-bar,
.editor.is-simulating .edge-hit {
  pointer-events: none;
}

/* ---------- 結果（条件パネルの下。通信路や Bob を隠さない位置） ---------- */
.result {
  flex: 1 1 auto;
  min-height: 0;
  padding: 0.9rem 1.1rem 1.1rem;
  overflow: auto;
  background: rgba(255, 255, 255, 0.97);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-lift);
}
.result[hidden] { display: none; }
.result:focus { outline: none; }

.result-head {
  display: flex;
  align-items: center;
  gap: 1rem;
  padding: 0.6rem 1rem;
  border-radius: var(--r-md);
}
.result.is-broken .result-head     { background: var(--mallory-soft); }
.result.is-safe .result-head       { background: var(--ok-soft); }
.result.is-incomplete .result-head { background: var(--sun-soft); }

.result-title {
  flex: 1;
  font-weight: 800;
  color: var(--ink);
}
.page-simulator .result-title {
  font-size: 1.15rem;
  line-height: 1.4;
  color: var(--ink);
}
.result-head .rating {
  flex: none;
  width: 3rem;
  height: 3rem;
  font-size: 1.4rem;
}
.result-close {
  flex: none;
  display: grid;
  place-items: center;
  width: 2rem;
  height: 2rem;
  padding: 0;
  font: inherit;
  font-weight: 800;
  color: var(--ink-soft);
  background: rgba(255, 255, 255, 0.8);
  border: 2px solid var(--line);
  border-radius: 50%;
  cursor: pointer;
}
.result-close:hover {
  color: #fff;
  background: var(--ink-soft);
}

.result-flow {
  margin-top: 0.75rem;
  padding: 0.5rem 1rem;
  font-size: 0.85rem;
  font-weight: 700;
  color: var(--ink-soft);
  background: var(--bg);
  border-radius: var(--r-md);
}

.result-objectives {
  display: grid;
  grid-template-columns: 1fr;
  gap: 0.75rem;
  margin-top: 0.75rem;
}
.result-objective {
  padding: 0.8rem 1.1rem;
  border: 2px solid var(--line);
  border-radius: var(--r-md);
}
.result-objective.is-met   { border-color: var(--ok); }
.result-objective.is-unmet { border-color: var(--mallory); }

.result-objective h3 {
  display: flex;
  justify-content: space-between;
  gap: 0.5rem;
  font-size: 0.95rem;
  font-weight: 800;
}
.result-objective.is-met h3   { color: #1c8656; }
.result-objective.is-unmet h3 { color: #c63d56; }

.check-list {
  display: grid;
  gap: 0.5rem;
  margin-top: 0.5rem;
}
.check-item {
  font-size: 0.85rem;
  line-height: 1.6;
}
.check-item strong {
  display: block;
}
.check-item p {
  color: var(--ink-soft);
}
.check-item.is-met strong::before   { content: "✓ "; color: var(--ok); }
.check-item.is-unmet strong::before { content: "× "; color: var(--mallory); }

.result-note {
  margin-top: 0.75rem;
  padding: 0.5rem 1rem;
  font-size: 0.85rem;
  font-weight: 700;
  color: #8a6200;
  background: var(--sun-soft);
  border-radius: var(--r-pill);
  text-align: center;
}

.result-problems {
  display: grid;
  gap: 0.4rem;
  margin-top: 0.75rem;
  padding-left: 1.25rem;
  font-size: 0.9rem;
  list-style: disc;
}

.result-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 0.6rem;
  margin-top: 1rem;
}
.result-actions .button {
  padding: 0.5rem 1.2rem;
  font-size: 0.9rem;
}
.result-actions .button-secondary {
  padding: calc(0.5rem - 2px) calc(1.2rem - 2px);
}

/* ---------- 部品の種類ごとの色 ---------- */
.node-alicepair, .node-bobpair { border-color: var(--pubc); background: #fff9e6; }
.node-hash,
.node-hashcheck,
.node-mac,
.node-maccheck { border-color: var(--authc); background: #e6fcf5; }
.node-sign,
.node-verify,
.node-ca,
.node-certcheck { border-color: var(--privc); background: #fff0f6; }
.node-tls,
.node-tlsopen  { border-color: #2b8a3e; background: #ebfbee; }

.palette-alicepair, .palette-bobpair { border-color: var(--pubc); }
.palette-hash,
.palette-hashcheck,
.palette-mac,
.palette-maccheck { border-color: var(--authc); }
.palette-sign,
.palette-verify,
.palette-ca,
.palette-certcheck { border-color: var(--privc); }
.palette-tls,
.palette-tlsopen  { border-color: #2b8a3e; }

.node-title {
  font-size: 0.95rem;
}

/* 鍵（公開鍵・秘密鍵）のポートと線 */
.port-type-pub  { border-color: var(--pubc); }
.port-type-priv { border-color: var(--privc); }
.edge-pub  .edge-line { stroke: #f1dc9a; stroke-dasharray: 2 8; }
.edge-priv .edge-line { stroke: #f0b3c9; stroke-dasharray: 2 8; }

/* 部品が増えたので、一覧は折り返して 2〜3 段まで */
.palette-bar {
  max-width: min(1080px, calc(100% - 1.5rem));
}
.palette {
  flex-wrap: wrap;
  max-height: 9.4rem;
  overflow-x: hidden;
  overflow-y: auto;
}
.palette-item {
  min-width: 6.4rem;
  padding: 0.3rem 0.75rem;
}
.palette-item strong {
  font-size: 0.85rem;
}
.palette-item span {
  max-width: 11rem;
  font-size: 0.68rem;
  line-height: 1.35;
}

/* 部品の目印 */
.palette-tag {
  margin-left: 0.4rem;
  padding: 0 0.45rem;
  font-size: 0.62rem;
  font-style: normal;
  font-weight: 800;
  vertical-align: 0.1em;
  border-radius: var(--r-pill);
}
.tag-new {
  color: #fff;
  background: var(--mallory);
}
.tag-preview {
  color: var(--primary-deep);
  background: var(--primary-soft);
}

/* 通信路の攻撃者欄 */
.eve-caps {
  flex-basis: 100%;
  line-height: 1.5;
}
.eve-row {
  align-items: flex-start;
}

/* 条件パネル: このステージで学ぶこと */
.brief-lesson {
  margin-top: 0.7rem;
  background: var(--bg);
  border-radius: var(--r-md);
}
.brief-lesson[hidden] { display: none; }
.brief-lesson summary {
  padding: 0.4rem 0.9rem;
  font-size: 0.82rem;
  font-weight: 800;
  color: var(--primary-deep);
  cursor: pointer;
}
.lesson-list {
  margin: 0;
  padding: 0 0.9rem 0.8rem;
  font-size: 0.78rem;
  line-height: 1.6;
}
.lesson-list dt {
  margin-top: 0.5rem;
  font-weight: 800;
  color: var(--ink-soft);
}
.lesson-list dd {
  margin: 0;
}
.objective-unlock {
  font-weight: 700;
  color: var(--primary-deep);
}

/* 結果: Mallory の攻撃のようす */
.attack-info {
  margin-top: 0.75rem;
  padding: 0.7rem 1rem;
  background: var(--bg);
  border-radius: var(--r-md);
}
.attack-info h4 {
  margin: 0 0 0.4rem;
  font-size: 0.85rem;
  font-weight: 800;
  color: var(--ink-soft);
}
.attack-list {
  display: grid;
  gap: 0.4rem;
  font-size: 0.82rem;
  line-height: 1.6;
}
.attack-item::before {
  content: "● ";
}
.attack-item.is-good::before { color: var(--ok); }
.attack-item.is-bad::before  { color: var(--mallory); }

/* ---------- 解説 ---------- */
.brief-buttons {
  display: flex;
  flex: none;
  gap: 0.4rem;
}
.brief-guide {
  color: #fff;
  background: var(--primary);
}
.brief-guide[hidden] { display: none; }

.guide {
  position: fixed;
  inset: 0;
  z-index: 60;
  display: grid;
  place-items: center;
  padding: 1rem;
  background: rgba(38, 49, 82, 0.5);
}
.guide[hidden] { display: none; }

.guide-card {
  display: flex;
  flex-direction: column;
  width: min(680px, 100%);
  max-height: 88vh;
  max-height: 88dvh;
  background: var(--surface);
  border-radius: var(--r-lg);
  box-shadow: 0 20px 60px rgba(38, 49, 82, 0.35);
}
.guide-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  padding: 1.1rem 1.4rem 0.6rem;
}
.page-simulator .guide-head h2 {
  font-size: 1.3rem;
  color: var(--ink);
}
.guide-close {
  flex: none;
  display: grid;
  place-items: center;
  width: 2.2rem;
  height: 2.2rem;
  padding: 0;
  font: inherit;
  font-weight: 800;
  color: var(--ink-soft);
  background: var(--bg);
  border: 2px solid var(--line);
  border-radius: 50%;
  cursor: pointer;
}
.guide-close:hover { color: #fff; background: var(--ink-soft); }

.guide-body {
  flex: 1 1 auto;
  min-height: 0;
  padding: 0 1.4rem 0.6rem;
  overflow: auto;
  line-height: 1.8;
}
.guide-lead {
  padding: 0.7rem 1rem;
  font-weight: 700;
  color: var(--primary-deep);
  background: var(--primary-soft);
  border-radius: var(--r-md);
}
.guide-section {
  margin-top: 1rem;
}
.page-simulator .guide-section h3 {
  margin: 0 0 0.2rem;
  font-size: 1rem;
  font-weight: 800;
  color: var(--ink);
}
.guide-section p {
  font-size: 0.92rem;
  color: var(--ink-soft);
}
.guide-parts {
  margin-top: 1.2rem;
}
.page-simulator .guide-parts h3 {
  margin: 0 0 0.5rem;
  font-size: 1rem;
  font-weight: 800;
  color: var(--ink);
}
.guide-part {
  margin-bottom: 0.6rem;
  padding: 0.6rem 0.9rem;
  background: var(--bg);
  border-left: 5px solid var(--primary);
  border-radius: var(--r-md);
}
.guide-part strong {
  font-size: 0.95rem;
}
.guide-part span {
  margin-left: 0.5rem;
  font-size: 0.78rem;
  color: var(--ink-soft);
}
.guide-part p {
  margin-top: 0.15rem;
  font-size: 0.85rem;
  line-height: 1.7;
  color: var(--ink-soft);
}
.guide-more {
  margin-top: 0.8rem;
}
.guide-more summary {
  font-size: 0.88rem;
  font-weight: 800;
  color: var(--primary-deep);
  cursor: pointer;
}
.guide-more .guide-part {
  margin-top: 0.5rem;
  border-left-color: var(--line);
}
.guide-foot {
  display: flex;
  justify-content: flex-end;
  padding: 0.8rem 1.4rem 1.1rem;
}

/* 結果: 解説・ヒント */
.explain {
  margin-top: 0.75rem;
  padding: 0.7rem 1rem;
  background: var(--primary-soft);
  border-radius: var(--r-md);
}
.explain h4 {
  margin: 0 0 0.25rem;
  font-size: 0.85rem;
  font-weight: 800;
  color: var(--primary-deep);
}
.explain p,
.explain li {
  font-size: 0.88rem;
  line-height: 1.75;
}
.explain ul {
  display: grid;
  gap: 0.2rem;
  padding-left: 1.2rem;
  list-style: disc;
}
.explain.is-hint {
  background: var(--sun-soft);
}
.explain.is-hint h4 {
  color: #8a6200;
}

/* ---------- 用語（文中のリンク・用語集） ---------- */
.term {
  display: inline;
  padding: 0;
  font: inherit;
  color: var(--primary-deep);
  background: none;
  border: none;
  border-bottom: 2px dotted var(--primary);
  border-radius: 0;
  cursor: help;
}
.term:hover {
  background: var(--primary-soft);
}

.brief-glossary {
  color: var(--primary-deep);
}
.brief-group-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 0.5rem;
  margin-bottom: 0.3rem;
}
.brief-group-head h2 {
  margin: 0;
}
.brief-group-head .term {
  font-size: 0.75rem;
  font-weight: 700;
}

.term-dialog {
  z-index: 70;
}
.term-cat {
  margin: 0 0 0.1rem;
  font-size: 0.72rem;
  font-weight: 800;
  color: var(--primary-deep);
}
.term-dialog .guide-section p,
.guide-section p,
.guide-part p {
  white-space: pre-line;
}
.term-see {
  margin-top: 1.1rem;
}
.page-simulator .term-see h3 {
  margin: 0 0 0.4rem;
  font-size: 0.9rem;
  font-weight: 800;
  color: var(--ink);
}
.term-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem;
}
.term-chip {
  padding: 0.15rem 0.8rem;
  font: inherit;
  font-size: 0.82rem;
  font-weight: 700;
  color: var(--primary-deep);
  background: var(--primary-soft);
  border: none;
  border-radius: var(--r-pill);
  cursor: pointer;
}
.term-chip:hover {
  background: #d9deff;
}
.term-dialog .guide-foot {
  gap: 0.6rem;
}

.glossary-search {
  width: 100%;
  margin-bottom: 0.4rem;
  padding: 0.55rem 1rem;
  font: inherit;
  color: var(--ink);
  background: var(--bg);
  border: 2px solid var(--line);
  border-radius: var(--r-pill);
}
.glossary-search:focus {
  border-color: var(--primary);
  outline: none;
}
.glossary-group {
  margin-top: 1rem;
}
.glossary-group[hidden] { display: none; }
.page-simulator .glossary-group h3 {
  margin: 0 0 0.4rem;
  font-size: 0.85rem;
  font-weight: 800;
  color: var(--ink-soft);
}
.glossary-items {
  display: grid;
  gap: 0.4rem;
}
.glossary-items li[hidden] { display: none; }
.glossary-item {
  display: block;
  width: 100%;
  padding: 0.5rem 0.9rem;
  font: inherit;
  text-align: left;
  color: var(--ink);
  background: var(--bg);
  border: none;
  border-left: 5px solid var(--primary-soft);
  border-radius: var(--r-md);
  cursor: pointer;
}
.glossary-item:hover {
  border-left-color: var(--primary);
  background: var(--primary-soft);
}
.glossary-item strong {
  display: block;
  font-size: 0.92rem;
}
.glossary-item span {
  font-size: 0.78rem;
  color: var(--ink-soft);
}

/* 部品の「?」ボタン */
.node-help {
  flex: none;
  display: grid;
  place-items: center;
  width: 1.5rem;
  height: 1.5rem;
  padding: 0;
  font: inherit;
  font-size: 0.8rem;
  font-weight: 800;
  line-height: 1;
  color: var(--primary-deep);
  background: rgba(255, 255, 255, 0.85);
  border: 2px solid var(--primary-soft);
  border-radius: 50%;
  cursor: pointer;
}
.node-help:hover {
  color: #fff;
  background: var(--primary);
  border-color: var(--primary);
}

/* 攻撃者の環境の説明 */
.caps dd small {
  display: block;
  margin-top: 0.05rem;
  font-size: 0.7rem;
  font-weight: 500;
  line-height: 1.5;
  color: var(--ink-soft);
}
.caps dt {
  line-height: 1.6;
}
.caps dt .term {
  font-size: inherit;
}

/* ---------- 解説: 場面・手順や計算例 ---------- */
.guide-scene {
  margin: 0.2rem 0 0.9rem;
  padding: 0.8rem 1.1rem;
  background: var(--sun-soft);
  border-left: 6px solid var(--sun);
  border-radius: var(--r-md);
}
.guide-scene strong {
  display: block;
  margin-bottom: 0.2rem;
  font-size: 1.05rem;
  font-weight: 800;
  color: #8a6200;
}
.guide-scene p {
  font-size: 0.92rem;
  line-height: 1.85;
  color: var(--ink);
}

.guide-code {
  margin: 0.55rem 0 0;
  padding: 0.75rem 1rem;
  overflow-x: auto;
  font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, "Noto Sans Mono CJK JP", monospace;
  font-size: 0.8rem;
  line-height: 1.7;
  color: #eef1ff;
  white-space: pre;
  background: #263152;
  border-radius: var(--r-md);
}

.explain p + p {
  margin-top: 0.5rem;
}
.explain strong {
  display: block;
  font-size: 0.78rem;
  font-weight: 800;
  color: var(--primary-deep);
}
.explain-question {
  padding: 0.5rem 0.8rem;
  background: rgba(255, 255, 255, 0.7);
  border-radius: var(--r-md);
}

/* ---------- 狭い画面 ---------- */
@media (max-width: 900px) {
  .editor.has-result .toolbar,
  .editor.has-result .zoom-controls {
    display: none;
  }
}

@media (max-width: 640px) {
  .side-stack {
    max-height: calc(100% - 1.5rem - 10rem);
  }
  .toolbar {
    top: 4.1rem;
    left: 0.75rem;
    right: 0.75rem;
    flex-wrap: nowrap;
    gap: 0.4rem;
    max-width: none;
    justify-content: space-between;
  }
  .zoom-controls {
    top: 7.6rem;
  }
  .zoom-controls button {
    width: 2.3rem;
    height: 2.3rem;
  }
  .toolbar .button {
    padding: 0.35rem 0.75rem;
    font-size: 0.78rem;
    white-space: nowrap;
  }
  .toolbar .button-secondary {
    padding: calc(0.35rem - 2px) calc(0.75rem - 2px);
  }
  .segmented {
    gap: 0.1rem;
    padding: 0.15rem 0.2rem 0.15rem 0.55rem;
    font-size: 0.72rem;
    white-space: nowrap;
  }
  .segmented-btn {
    min-width: 1.8rem;
    padding: 0.15rem 0.5rem;
  }
  .palette-hint {
    display: none;
  }
}


/* ==========================================================
   見直し（色の整理・部品一覧のタブ・お知らせ・チュートリアル）
   ========================================================== */

/* ---------- 色は少なく。部品・ポート・線は、種類ごとに3色だけ ---------- */
.node-key,
.node-alicepair, .node-bobpair { border-color: var(--key); background: #f7f0ff; }
.node-encrypt,
.node-decrypt,
.node-tls,
.node-tlsopen,
.node-hash,
.node-hashcheck,
.node-mac,
.node-maccheck,
.node-sign,
.node-verify,
.node-ca,
.node-certcheck { border-color: var(--authc); background: #e6fcf5; }

.palette-key,
.palette-alicepair, .palette-bobpair { border-color: var(--key); }
.palette-encrypt,
.palette-decrypt,
.palette-tls,
.palette-tlsopen,
.palette-hash,
.palette-hashcheck,
.palette-mac,
.palette-maccheck,
.palette-sign,
.palette-verify,
.palette-ca,
.palette-certcheck { border-color: var(--authc); }

.port-type-pub,
.port-type-priv { border-color: var(--key); }
.edge-pub .edge-line,
.edge-priv .edge-line { stroke: var(--wire-key); stroke-dasharray: 2 8; }

/* ---------- 線の上の「いまの状態」の文字 ---------- */
.edge-label {
  pointer-events: none;
}
.edge-label rect {
  fill: #fff;
  stroke-width: 2;
}
.edge-label text {
  font-family: var(--font);
  font-size: 11px;
  font-weight: 800;
  fill: var(--ink);
}

/* ---------- 部品一覧: 種類ごとのタブ ---------- */
.palette-bar {
  max-width: min(880px, calc(100% - 1.5rem));
  padding: 0.5rem 0.9rem 0.5rem;
}
.palette-tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem;
  margin: 0.15rem 0 0.5rem;
}
.palette-tabs[hidden],
.palette[hidden] { display: none; }
.palette-tab {
  position: relative;
  display: flex;
  align-items: baseline;
  gap: 0.35rem;
  padding: 0.2rem 0.95rem;
  font: inherit;
  font-size: 0.85rem;
  font-weight: 800;
  color: var(--ink-soft);
  background: var(--bg);
  border: 2px solid var(--line);
  border-radius: var(--r-pill);
  cursor: pointer;
}
.palette-tab small {
  font-size: 0.7rem;
  font-weight: 700;
}
.palette-tab[aria-selected="true"] {
  color: #fff;
  background: var(--primary);
  border-color: var(--primary);
}
.tab-dot {
  position: absolute;
  top: -3px;
  right: -3px;
  width: 0.65rem;
  height: 0.65rem;
  background: var(--mallory);
  border: 2px solid #fff;
  border-radius: 50%;
}
.palette {
  flex-wrap: wrap;
  max-height: none;
  overflow: visible;
  padding: 0.1rem 0.1rem 0.45rem;
}
.palette-item {
  min-width: 8.4rem;
  max-width: 13rem;
}
.legend-note {
  margin-left: auto;
  font-weight: 500;
}

/* ---------- 条件パネル: 短く ---------- */
.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 0.3rem;
  margin-top: 0.35rem;
}
.chip {
  padding: 0.05rem 0.7rem;
  font-size: 0.72rem;
  font-weight: 700;
  line-height: 1.6;
  color: var(--primary-deep);
  background: var(--primary-soft);
  border-radius: var(--r-pill);
}
.cap-new {
  margin-left: 0.4rem;
  padding: 0 0.5rem;
  font-size: 0.62rem;
  font-style: normal;
  font-weight: 800;
  color: #fff;
  background: var(--mallory);
  border-radius: var(--r-pill);
}
.objective.is-done .objective-mark {
  color: #fff;
  background: var(--ok);
}
.objective.is-done .objective-title {
  font-weight: 600;
  color: var(--ink-soft);
}
.status-link {
  font-weight: 800;
  color: var(--primary-deep);
}

/* ---------- お知らせ ---------- */
.toast {
  position: absolute;
  top: 4.6rem;
  left: 50%;
  z-index: 45;
  max-width: calc(100% - 2rem);
  padding: 0.6rem 1.3rem;
  font-weight: 800;
  line-height: 1.6;
  text-align: center;
  color: #fff;
  background: var(--primary);
  border-radius: var(--r-pill);
  box-shadow: var(--shadow-lift);
  transform: translateX(-50%);
}
.toast[hidden] { display: none; }

/* ---------- チュートリアル ---------- */
.coach {
  position: absolute;
  left: 50%;
  bottom: 6rem;
  z-index: 25;
  width: min(540px, calc(100% - 1.5rem));
  padding: 0.8rem 1.3rem 1rem;
  background: #fff;
  border: 3px solid var(--sun);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-lift);
  transform: translateX(-50%);
}
.coach[hidden] { display: none; }
.coach-step {
  margin: 0;
  font-size: 0.75rem;
  font-weight: 800;
  color: #8a6200;
}
.coach-text {
  margin: 0.2rem 0 0;
  font-size: 1rem;
  font-weight: 700;
  line-height: 1.75;
}
.tutorial-target {
  outline: 4px solid var(--sun) !important;
  outline-offset: 3px;
  animation: tutorial-pulse 1.3s ease-in-out infinite;
}
.node-head.tutorial-target {
  border-radius: var(--r-md);
}
@keyframes tutorial-pulse {
  0%, 100% { box-shadow: 0 0 0 5px rgba(255, 201, 77, 0.55); }
  50%      { box-shadow: 0 0 0 14px rgba(255, 201, 77, 0.12); }
}
@media (prefers-reduced-motion: reduce) {
  .tutorial-target { animation: none; box-shadow: 0 0 0 8px rgba(255, 201, 77, 0.45); }
}

@media (max-width: 640px) {
  .coach {
    bottom: 5rem;
  }
  .legend-note {
    display: none;
  }
}

/* ---------- スマホ幅: 部品一覧は1行でスクロール、パネルの見出しは1行 ---------- */
@media (max-width: 640px) {
  .brief-bar {
    flex-wrap: nowrap;
  }
  .brief-bar h1 {
    min-width: 0;
    overflow: hidden;
    font-size: 0.95rem;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .brief-toggle {
    padding: 0.1rem 0.6rem;
    font-size: 0.74rem;
  }
  .palette {
    flex-wrap: nowrap;
    overflow-x: auto;
  }
  .palette-item {
    flex: none;
    min-width: 8rem;
  }
  .legend {
    gap: 0.1rem 0.6rem;
    margin-bottom: 0.3rem;
    font-size: 0.68rem;
  }
  .palette-bar {
    padding: 0.4rem 0.7rem 0.3rem;
  }
}


/* ---------- Mallory の攻撃の記録（通信路の中） ---------- */
.attack-log {
  display: grid;
  gap: 0.3rem;
  margin: 0.45rem 0 0;
  padding: 0.45rem 0 0;
  border-top: 2px dashed var(--line);
}
.attack-log[hidden] { display: none; }
.attack-row {
  font-size: 0.74rem;
  line-height: 1.5;
}
.attack-row strong {
  margin-right: 0.35rem;
  color: var(--mallory);
}
.attack-deed {
  color: var(--ink-soft);
}
.attack-result {
  display: block;
  font-weight: 800;
}
.attack-row.tone-good .attack-result { color: #1c8656; }
.attack-row.tone-bad  .attack-result { color: #c63d56; }

/* ---------- 想定解の説明（配置を変えるまで残る） ---------- */
.toast.is-note {
  width: min(560px, calc(100% - 2rem));
  padding: 0.7rem 1.2rem;
  font-size: 0.88rem;
  line-height: 1.7;
  text-align: left;
  border-radius: var(--r-md);
}
@media (max-width: 640px) {
  .toast.is-note { top: 8.4rem; }
}


/* ---------- 評価の理由 ---------- */
.rating-note {
  border-radius: var(--r-md);
  text-align: left;
}
.rating-note strong {
  display: block;
  font-size: 0.88rem;
  line-height: 1.7;
}
.rating-note small {
  display: block;
  margin-top: 0.2rem;
  font-size: 0.74rem;
  font-weight: 700;
  color: #8a6200;
}

/* 想定解より少ないときの、ひとこと（評価の目的にならないよう、控えめに） */
.rating-note.is-nice {
  color: #1c8656;
  background: var(--ok-soft);
}
.rating-note.is-nice small {
  color: #1c8656;
}

/* ==========================================================
   ゾーン（Alice のゾーン / 公開ゾーン / Bob のゾーン）と、攻撃者
   ========================================================== */

/* 上に見出しの帯をとるので、条件・ボタン・拡大縮小を、少し下げる */
.side-stack { top: 3.2rem; max-height: calc(100% - 3.2rem - 9rem); }
.toolbar { top: 3.2rem; }
.zoom-controls { top: 7rem; }
.toast { top: 7.6rem; }

.zone {
  position: absolute;
  top: -3000px;
  height: 8000px;
  pointer-events: none;
}
.zone-alice { background: rgba(84, 104, 255, 0.06); border-right: 3px dashed rgba(84, 104, 255, 0.28); }
.zone-public { background: rgba(255, 138, 31, 0.11); border-right: 3px dashed rgba(238, 95, 120, 0.32); transition: background 0.4s; }
.zone-bob { background: rgba(43, 182, 115, 0.07); }
.zone-public.is-breached { background: rgba(238, 95, 120, 0.2); }
.zone-public.is-safe { background: rgba(43, 182, 115, 0.16); }

/* 見出しの帯（画面の上に固定。拡大・移動に合わせて、横の位置だけ動く） */
.zone-tags {
  position: absolute;
  top: 0.55rem;
  left: 0;
  right: 0;
  height: 2rem;
  z-index: 6;
  pointer-events: none;
}
.zone-tag {
  position: absolute;
  top: 0;
  padding: 0.2rem 0.9rem;
  overflow: hidden;
  font-size: 0.8rem;
  font-weight: 800;
  line-height: 1.5;
  color: var(--ink);
  text-align: center;
  text-overflow: ellipsis;
  white-space: nowrap;
  background: rgba(255, 255, 255, 0.92);
  border-radius: var(--r-pill);
  box-shadow: var(--shadow-soft);
  transform: translateX(-50%);
}
.zone-tag-alice { color: #3c4bd6; }
.zone-tag-public { color: #c4610a; }
.zone-tag-bob { color: #1c8656; }

/* 公開されている線（誰でも見られる）は、あたたかい色 */
.edge.is-public .edge-line { stroke: #f4c597; }
.edge.edge-key.is-public .edge-line,
.edge.edge-priv.is-public .edge-line { stroke: #f1a6bd; }
.edge.is-targeted .edge-line {
  stroke: var(--mallory);
  stroke-width: 6;
}

/* 公開ゾーンに置いた部品は、公開されている */
.node[data-zone="public"] {
  box-shadow: 0 0 0 4px rgba(255, 138, 31, 0.4), var(--shadow-soft);
}
.node.is-flash {
  outline: 4px solid var(--mallory);
  outline-offset: 2px;
}

/* ---------- 攻撃者 ---------- */
.attacker {
  position: absolute;
  z-index: 8;
  width: 112px;
  text-align: center;
  transform: translate(-50%, -100%);
  transition-property: left, top;
  transition-timing-function: ease-in-out;
  pointer-events: none;
}
.attacker[hidden] { display: none; }
.attacker-figure { display: block; margin: 0 auto; }
.attacker-figure .fig-head { fill: #ffe0c2; stroke: var(--who, #14a39b); stroke-width: 3; }
.attacker-figure .fig-body { fill: var(--who, #14a39b); }
.attacker-figure .fig-hat { fill: #2d3556; }
.attacker-name {
  display: inline-block;
  margin-top: 0.1rem;
  padding: 0 0.7rem;
  font-size: 0.78rem;
  font-weight: 800;
  color: #fff;
  background: var(--who, #14a39b);
  border-radius: var(--r-pill);
}
.attacker-bubble {
  position: absolute;
  bottom: calc(100% + 0.5rem);
  left: 50%;
  display: flex;
  align-items: center;
  gap: 0.4rem;
  width: max-content;
  max-width: 290px;
  padding: 0.5rem 0.9rem;
  font-size: 0.9rem;
  font-weight: 800;
  line-height: 1.5;
  text-align: left;
  background: #fff;
  border: 3px solid var(--who, #14a39b);
  border-radius: 1.1rem;
  box-shadow: var(--shadow-soft);
  transform: translateX(-50%);
}
.attacker-bubble[hidden] { display: none; }
.attacker-bubble .bubble-icon { font-size: 1.35rem; line-height: 1; }
/* 考えているとき: 点線の吹き出し（これから、何をするつもりか） */
.attacker-bubble.is-think {
  color: var(--ink-soft);
  background: #f6f7ff;
  border-style: dashed;
}
.attacker-bubble.is-think .bubble-text::before { content: '考え中: '; font-weight: 500; }
/* やったとき: 結果の色 */
.attacker-bubble.tone-bad  { color: #b3263f; background: #fff0f3; border-color: var(--mallory); }
.attacker-bubble.tone-good { color: #1c8656; background: #effcf6; border-color: var(--ok); }

/* ---------- 公開ゾーンの記録 ---------- */
.zone-log {
  position: absolute;
  top: 95px;
  z-index: 3;
  display: grid;
  gap: 0.25rem;
  width: 330px;
  margin: 0;
  padding: 0.7rem 0.9rem;
  list-style: none;
  font-size: 0.82rem;
  line-height: 1.5;
  background: rgba(255, 255, 255, 0.92);
  border-radius: var(--r-md);
  box-shadow: var(--shadow-soft);
  pointer-events: none;
}
.zone-log[hidden] { display: none; }
.zone-log-head { font-weight: 800; color: #c4610a; }
.zone-log li { display: flex; gap: 0.4rem; }
.zone-log .log-icon { flex: none; }
.zone-log .tone-bad  { color: #b3263f; font-weight: 700; }
.zone-log .tone-good { color: #1c8656; font-weight: 700; }

@media (max-width: 640px) {
  .zone-tag { font-size: 0.68rem; padding: 0.15rem 0.5rem; }
  .side-stack { top: 3rem; }
  .toolbar { top: 3rem; }
  .zoom-controls { top: 6.5rem; }
}

/* hidden 属性を、ボタンの display より優先する（チュートリアルでは、想定解ボタンを出さない） */
.toolbar [hidden] { display: none !important; }

/* ==========================================================
   見直し: ゾーンは画面側に描く／境界をドラッグ／人の形／詳しい吹き出し／注意
   ========================================================== */

/* ゾーンの背景は、盤面に直接描く（どんなに縮小・移動しても、上下いっぱいに広がる） */
.zone {
  top: 0;
  bottom: 0;
  height: auto;
}

/* ゾーンの境界（ドラッグで広さを変える） */


/* Alice・Bob も人の形 */
.node-figure { flex: none; margin-right: 0.15rem; }
.node-figure .fig-head { fill: #ffe0c2; stroke: var(--who); stroke-width: 3; }
.node-figure .fig-body { fill: var(--who); }

/* 置き場所の注意 */
.node-warn {
  flex: none;
  padding: 0 0.3rem;
  font-size: 0.8rem;
  color: #8a6200;
  background: var(--sun-soft);
  border-radius: var(--r-pill);
  cursor: help;
}
.node-warn[hidden] { display: none; }
.node.is-warn { box-shadow: 0 0 0 3px rgba(255, 201, 77, 0.8), var(--shadow-soft); }

/* 吹き出し: 何を考えているのか（詳しい説明つき） */
.attacker-bubble { max-width: 360px; align-items: flex-start; }
.bubble-body { display: grid; gap: 0.25rem; }
.bubble-detail {
  font-size: 0.78rem;
  font-weight: 500;
  line-height: 1.6;
  color: var(--ink-soft);
}
.bubble-detail[hidden] { display: none; }

/* 結果: 本物の通信と、攻撃された通信 */
.result-scenes {
  display: grid;
  gap: 0.3rem;
  margin: 0 0 0.7rem;
  padding: 0.6rem 0.8rem;
  font-size: 0.82rem;
  font-weight: 700;
  line-height: 1.6;
  background: var(--bg);
  border-radius: var(--r-md);
}
.result-scenes p { margin: 0; }
.result-scenes .is-ok { color: #1c8656; }
.result-scenes .is-ng { color: #c63d56; }
.result-warn {
  margin: 0 0 0.7rem;
  padding: 0.5rem 0.9rem 0.5rem 1.4rem;
  font-size: 0.8rem;
  line-height: 1.6;
  color: #8a6200;
  list-style: none;
  background: var(--sun-soft);
  border-radius: var(--r-md);
}


/* ==========================================================
   目標の切り替え（A / B）・Alice と Bob の吹き出し
   ========================================================== */
.objective-switch {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  margin: 0.3rem 0 0.6rem;
}
.objective-switch[hidden] { display: none; }
.switch-label {
  margin-right: 0.2rem;
  font-size: 0.78rem;
  font-weight: 800;
  color: var(--ink-soft);
}
.switch-btn {
  padding: 0.15rem 0.9rem;
  font: inherit;
  font-size: 0.85rem;
  font-weight: 800;
  color: var(--ink-soft);
  background: var(--bg);
  border: 2px solid var(--line);
  border-radius: var(--r-pill);
  cursor: pointer;
}
.switch-btn.is-done { color: #1c8656; border-color: var(--ok); }
.switch-btn.is-active { color: #fff; background: var(--primary); border-color: var(--primary); }
.switch-btn:disabled { opacity: 0.55; cursor: not-allowed; }

.node-bubble {
  position: absolute;
  bottom: calc(100% + 0.5rem);
  left: 50%;
  z-index: 7;
  width: max-content;
  max-width: 230px;
  padding: 0.4rem 0.8rem;
  font-size: 0.82rem;
  font-weight: 800;
  line-height: 1.5;
  color: var(--ink);
  text-align: left;
  background: #fff;
  border: 3px solid var(--ink-soft);
  border-radius: 1rem;
  box-shadow: var(--shadow-soft);
  transform: translateX(-50%);
  pointer-events: none;
}
.node-bubble[hidden] { display: none; }
.node-bubble.tone-good { color: #1c8656; background: #effcf6; border-color: var(--ok); }
.node-bubble.tone-bad { color: #b3263f; background: #fff0f3; border-color: var(--mallory); }
.node-bubble.tone-plain { color: var(--ink-soft); background: #f6f7ff; border-style: dashed; }


/* ==========================================================
   壁（ゾーンの間）と通信口。拡大縮小ボタンは、なくした
   ========================================================== */
.zone-alice { border-right: 0; }
.zone-public { border-right: 0; }

/* 壁: 細くて、はっきり見える。攻撃者は、ここを越えられない */
.zone-wall {
  position: absolute;
  top: 0;
  bottom: 0;
  z-index: 1;
  pointer-events: none;
  background: repeating-linear-gradient(0deg, #7a6150 0 14px, #4d3a2c 14px 16px);
  box-shadow: 0 0 0 2px #3b2c21, 0 0 10px rgba(0, 0, 0, 0.25);
}

/* 通信口: 壁にあいた、線の通り道 */
.wall-gate rect {
  fill: #fff3d6;
  stroke: #3b2c21;
  stroke-width: 4;
}


/* ---------- 実演 ---------- */
.demo-dialog .guide-section.demo-bad h3 { color: #b3263f; }
.demo-dialog .guide-section.demo-safe h3 { color: #1c8656; }
.demo-reason {
  margin-top: 0.3rem;
  font-size: 0.8rem;
  color: var(--ink-soft);
}


/* ブロックの幅は、中身（部品の名前・設定）に合わせて、変わる */
.node-title { white-space: normal; overflow-wrap: anywhere; }
.node-head { flex-wrap: wrap; }

/* 手渡しの鍵: 2つ1組。同じ番号・同じ色の印 */
.node.is-pair { border-color: var(--pair, var(--key)); }
.pair-badge {
  flex: none;
  padding: 0 0.45rem;
  font-size: 0.78rem;
  font-weight: 800;
  line-height: 1.6;
  color: #fff;
  background: var(--pair, var(--key));
  border-radius: var(--r-pill);
  cursor: help;
}

/* ---------- 実演: 大きな見出し ---------- */
.demo-banner {
  position: absolute;
  top: 4.4rem;
  left: 50%;
  z-index: 46;
  width: min(640px, calc(100% - 2rem));
  padding: 0.9rem 1.4rem;
  text-align: center;
  color: #fff;
  background: #2d3556;
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-lift);
  transform: translateX(-50%);
}
.demo-banner[hidden] { display: none; }
.demo-banner .demo-banner-tag { margin: 0; font-size: 0.8rem; font-weight: 800; color: #ffd34d; }
.demo-banner h2 { margin: 0.1rem 0 0; font-size: 1.35rem; font-weight: 800; line-height: 1.4; color: #fff; }
.demo-banner p { margin: 0.35rem 0 0; font-size: 1rem; font-weight: 700; line-height: 1.6; }
.demo-banner.is-bad { background: #c63d56; }
.demo-banner.is-safe { background: #1c8656; }
.demo-banner.is-bad h2, .demo-banner.is-safe h2 { font-size: 1.9rem; }

.demo-verdict {
  margin: 0 0 1rem;
  padding: 0.9rem 1.1rem;
  font-size: 1.5rem;
  font-weight: 800;
  line-height: 1.5;
  text-align: center;
  border-radius: var(--r-md);
}
.demo-verdict.is-bad { color: #b3263f; background: #fff0f3; }
.demo-verdict.is-safe { color: #1c8656; background: #effcf6; }
.demo-dialog .guide-section p { font-size: 1.05rem; line-height: 1.9; }
.demo-dialog .guide-section h3 { font-size: 1.1rem; }


/* ==========================================================
   起きていること（左上）。細かい攻撃者の設定は、出さない
   ========================================================== */
.situation {
  display: grid;
  gap: 0.35rem;
  margin: 0;
  padding: 0;
  list-style: none;
}
.situation li {
  position: relative;
  padding: 0.45rem 0.8rem 0.45rem 1.5rem;
  font-size: 0.92rem;
  font-weight: 700;
  line-height: 1.6;
  background: var(--mallory-soft, #fff0f3);
  border-radius: var(--r-md);
}
.situation li::before {
  content: '';
  position: absolute;
  top: 0.95rem;
  left: 0.6rem;
  width: 0.45rem;
  height: 0.45rem;
  background: var(--mallory);
  border-radius: 50%;
}
#attacker-caps,
#attacker-group .brief-group-head .term { display: none; }

/* 方式の、ひとこと説明 */
.algo-desc {
  display: block;
  max-width: 13rem;
  margin: 0.15rem 0 0.2rem;
  font-size: 0.72rem;
  font-weight: 500;
  line-height: 1.5;
  color: var(--ink-soft);
  white-space: normal;
}

.objective.is-single .objective-mark { display: none; }


/* 攻撃者のログは、出さない */
.zone-log { display: none !important; }

/* 手動で進める */
.manual-toggle {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  padding: 0.35rem 0.8rem;
  font-size: 0.82rem;
  font-weight: 700;
  color: var(--ink);
  background: rgba(255, 255, 255, 0.92);
  border-radius: var(--r-pill);
  box-shadow: var(--shadow-soft);
  cursor: pointer;
}
.next-step {
  /* 中央ぞろえは、transform を使わない（ボタンの、ホバーの動きで、横に、ずれないように） */
  position: absolute;
  bottom: 9.5rem;
  left: 0;
  right: 0;
  z-index: 47;
  width: max-content;
  margin: 0 auto;
}
.next-step[hidden] { display: none; }

.demo-dialog .guide-section p { margin: 0 0 0.6rem; }
.demo-dialog .guide-section h3 { font-size: 1.25rem; }


/* ===================== エピローグ ===================== */
.epilogue-start {
  position: absolute;
  bottom: 4rem;
  left: 0;
  right: 0;
  z-index: 47;
  width: max-content;
  margin: 0 auto;
  padding: 0.9rem 2.2rem;
  font-size: 1.1rem;
}
.epilogue-start[hidden] { display: none; }

/* 正体不明の攻撃者 */
.attacker.mystery { --who: #2d3556; }
.attacker.mystery .attacker-figure .fig-head { stroke: #2d3556; }
.attacker.mystery.is-appear { animation: mystery-in 0.9s ease both; }
.attacker.mystery.is-revealed .attacker-name { background: #2d3556; color: #ffd34d; }
@keyframes mystery-in {
  from { opacity: 0; transform: translate(-50%, -62%) scale(0.8); }
  to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
}
.hammer { position: absolute; top: 22px; left: 36px; transform-origin: 50% 90%; transform: rotate(-50deg); }
.hammer .hammer-handle { fill: #8a6f5a; }
.hammer .hammer-head { fill: #4d3a2c; }
.mystery.is-swing .hammer { animation: hammer-swing 0.45s ease-in; }
@keyframes hammer-swing {
  0% { transform: rotate(-50deg); }
  70% { transform: rotate(30deg); }
  100% { transform: rotate(30deg); }
}

/* 壁が、壊れる */
.zone-wall.is-hammered { animation: wall-hit 0.3s ease; }
@keyframes wall-hit {
  0%, 100% { transform: translateX(0); }
  30% { transform: translateX(-4px); }
  70% { transform: translateX(4px); }
}
.zone-wall.is-broken {
  background: repeating-linear-gradient(0deg, transparent 0 16px, #4d3a2c 16px 22px, transparent 22px 38px);
  box-shadow: none;
  opacity: 0.45;
  transition: opacity 0.6s, background 0.6s;
}
@media (prefers-reduced-motion: reduce) {
  .mystery.is-swing .hammer, .zone-wall.is-hammered, .attacker.mystery.is-appear { animation: none; }
}

.epilogue-line { font-size: 1.05rem; line-height: 1.9; }
.epilogue-question {
  margin: 1.2rem 0 0.4rem;
  padding: 1rem 1.2rem;
  font-size: 1.6rem;
  font-weight: 800;
  line-height: 1.6;
  text-align: center;
  color: #fff;
  background: #2d3556;
  border-radius: var(--r-md);
}


/* ===================== キャラクター ===================== */
.character { display: block; overflow: visible; }
.character .face-bad { display: none; }
/* あわてた顔: 攻撃された・届かない・吹き出しが「悪い」ときに出る */
.node.is-garbled .character .face-ok,
.node.is-blocked .character .face-ok,
.node:has(.node-bubble.tone-bad:not([hidden])) .character .face-ok,
.attacker:has(.attacker-bubble.tone-good:not([hidden])) .character .face-ok { display: none; }
.node.is-garbled .character .face-bad,
.node.is-blocked .character .face-bad,
.node:has(.node-bubble.tone-bad:not([hidden])) .character .face-bad,
.attacker:has(.attacker-bubble.tone-good:not([hidden])) .character .face-bad { display: inline; }
.character .glow { filter: drop-shadow(0 0 3px #41e6ff); }
.node-figure { flex: none; margin: -0.35rem 0.25rem -0.3rem -0.2rem; }
.attacker-figure { margin: 0 auto; filter: drop-shadow(0 3px 4px rgba(45, 53, 86, 0.25)); }
.attacker:not([hidden]) .attacker-figure { animation: character-float 2.8s ease-in-out infinite; }
@keyframes character-float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-3px); }
}
@media (prefers-reduced-motion: reduce) { .attacker:not([hidden]) .attacker-figure { animation: none; } }

/* Alice と Bob は、顔つきの部品。名前が、折り返されないように、少し広く */
.node-alice, .node-bob { min-width: 178px; }
.node-alice .node-title, .node-bob .node-title { white-space: nowrap; }

.attacker-figure, .node-figure { max-width: none; }
.hammer { left: 64px; top: 44px; }


/* ===================== キャラクターの画像 ===================== */
.character-img {
  position: relative;
  display: block;
  line-height: 0;
  overflow: visible;
}
.character-img img {
  display: block;
  width: 100%;
  height: 100%;
  max-width: none;
  object-fit: contain;
  pointer-events: none;
  user-select: none;
  -webkit-user-drag: none;
}
.character-img .face-bad { display: none; }
.node.is-garbled .character-img .face-bad,
.node.is-blocked .character-img .face-bad,
.node:has(.node-bubble.tone-bad:not([hidden])) .character-img .face-bad,
.attacker:has(.attacker-bubble.tone-good:not([hidden])) .character-img .face-bad { display: block; }
.attacker-figure.character-img { margin: 0 auto; }
</script>
<script type="text/plain" id="css-glossary">/* ==========================================================

/* ---------- 右: 説明 ---------- */
.glossary-detail {
  min-height: 12rem;

  font-weight: 800;

}
.page-glossary .detail-title {

  font-size: 1.6rem;

.detail-lead {

.detail-section p {

.term-link {

<script type="text/plain" id="css-characters-check">/* キャラクター画像のチェック（characters-check.html） */
.chars-main { max-width: 1040px; margin: 0 auto; padding: 2rem 1.2rem 4rem; }
.chars-main h1 { margin: 0 0 0.5rem; font-size: 1.6rem; }
.chars-main h2 { margin: 2.2rem 0 0.6rem; font-size: 1.2rem; }
.chars-main code { padding: 0.05rem 0.4rem; font-size: 0.9em; background: #eef1ff; border-radius: 6px; }
.chars-lead { margin: 0 0 0.8rem; line-height: 1.8; color: var(--ink-soft); }
.chars-summary { margin: 1rem 0; padding: 0.8rem 1.1rem; font-weight: 800; background: #fff; border-radius: 14px; box-shadow: var(--shadow-soft); }
.chars-summary.is-ok { color: #1c8656; background: #effcf6; }
.chars-summary.is-ng { color: #b3263f; background: #fff0f3; }
.chars-advice { margin: 0 0 1rem; padding: 0.9rem 1.1rem; line-height: 1.8; background: #fff8e1; border-radius: 14px; }
.chars-advice[hidden] { display: none; }
.chars-advice ul { margin: 0.3rem 0 0; padding-left: 1.3rem; }

.chars-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 1rem; }
.chars-card { padding: 0.8rem; background: #fff; border-radius: 16px; box-shadow: var(--shadow-soft); }
.chars-card h3 { margin: 0 0 0.1rem; font-size: 0.98rem; }
.chars-card .file { margin: 0 0 0.5rem; font-size: 0.78rem; color: var(--ink-soft); word-break: break-all; }
.chars-thumb {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 190px;
  margin-bottom: 0.6rem;
  overflow: hidden;
  border-radius: 12px;
  /* 市松模様: 透明な部分が、見えるように */

  background-image:
    linear-gradient(45deg, #dfe3f3 25%, transparent 25%, transparent 75%, #dfe3f3 75%),
    linear-gradient(45deg, #dfe3f3 25%, transparent 25%, transparent 75%, #dfe3f3 75%);

.chars-badges { display: flex; flex-wrap: wrap; gap: 0.3rem; margin: 0; padding: 0; list-style: none; }
.chars-badges li { padding: 0.12rem 0.6rem; font-size: 0.74rem; font-weight: 800; border-radius: 999px; }
.chars-badges .ok { color: #1c8656; background: #effcf6; }
.chars-badges .warn { color: #8a6200; background: #fff3cd; }
.chars-badges .ng { color: #b3263f; background: #fff0f3; }

.chars-ingame { display: grid; gap: 0.8rem; }
.chars-row { display: grid; grid-template-columns: 7rem 1fr; gap: 0.8rem; align-items: center; }
.chars-row > strong { font-size: 0.9rem; }
.chars-zones { display: grid; grid-template-columns: repeat(3, 1fr); border-radius: 14px; overflow: hidden; }
.chars-zones > div { display: flex; align-items: flex-end; justify-content: center; gap: 0.6rem; min-height: 170px; padding: 1rem 0.4rem 1.2rem; }
.chars-zones .character { flex: none; }
.chars-zones .z-alice { background: #eef0ff; }
.chars-zones .z-public { background: #fdeee4; }
.chars-zones .z-bob { background: #e8f6ef; }
.chars-zones .tag { font-size: 0.72rem; color: var(--ink-soft); }

/* ゲームの中と、同じ見え方にするための、キャラクターの最小限の設定 */

.character-img img { display: block; width: 100%; height: 100%; max-width: none; object-fit: contain; pointer-events: none; }
</script>

<script type="text/plain" id="page-top"><section class="g-section"><h2 class="g-title">ボタンとバッジ</h2><p class="g-note">共通のボタン。メインは黄色の塗り、サブは白＋藍の線。</p><div class="g-row"><div class="g-item "><div class="g-label">button-primary</div><a class="button button-primary" href="#">つづきから</a></div><div class="g-item "><div class="g-label">button-secondary</div><a class="button button-secondary" href="#">ステージを選ぶ</a></div><div class="g-item "><div class="g-label">button-secondary button-quiet</div><button class="button button-secondary button-quiet">やり直す</button></div><div class="g-item "><div class="g-label">無効（disabled）</div><button class="button button-primary" disabled>シミュレーション開始</button></div><div class="g-item "><div class="g-label">バッジ（Eve / Mallory）</div><span class="badge badge-eve">Eve（盗聴）</span> <span class="badge badge-mallory">Mallory（改ざん）</span></div></div></section><section class="g-section"><h2 class="g-title">トップページ（実物）</h2><p class="g-note">ヘッダー・ヒーロー・遊び方・ステージカード（クリア済み / いま遊べる / ロック中）。</p><header class="site-header">
    <a class="site-logo" href="index.html" aria-label="CRYPTA トップへ">CRYPTA</a>
    <p class="site-progress" id="progress" aria-live="polite">クリア 4 / 12</p>
  </header><main>

    <!-- ヒーロー -->
    <section class="hero" aria-labelledby="hero-title">
      <h1 id="hero-title">今送ったその情報、<br>本当に大丈夫？</h1>
      <p class="hero-lead">
        パスワードも、送金も、メッセージも、
        相手に届くまでに、いくつもの機器を通ります。
        その途中で、盗み見るEve、書き換えるMalloryがいたら。
        AliceとBobの通信を自分の手で組み立てて、攻撃を受けながら、暗号のしくみを学ぼう。
      </p>
      <div class="hero-actions">
        <a class="button button-primary" id="start-button" href="simulator.html?stage=stage05">つづきから</a>
        <a class="button button-secondary" href="#stage-section">ステージを選ぶ</a>
      </div>
    </section>

    <!-- 遊び方（順序があるので番号付き） -->
    <section class="how-to" aria-labelledby="how-to-title">
      <h2 id="how-to-title">遊び方</h2>
      <ol class="how-to-list">
        <li>
          <h3>通信を組み立てる</h3>
          <p>Alice と Bob の間に、暗号化や鍵などのコンポーネントをドラッグして配置します。</p>
        </li>
        <li>
          <h3>攻撃を受ける</h3>
          <p>シミュレーションを開始すると、EveやMalloryが実際に通信を攻撃します。</p>
        </li>
        <li>
          <h3>原因を知って、作り直す</h3>
          <p>どの要件が満たされていなかったかを確認し、必要な構成に改善します。</p>
        </li>
      </ol>
      <p class="how-to-note">必要なものを、必要な分だけ。余計な構成が少ないほど高く評価されます。</p>
    </section>

    <!-- ステージ一覧（js/index.js が #stage-list にカードを挿入する） -->
    <section class="stages" id="stage-section" aria-labelledby="stages-title">
      <h2 id="stages-title">ステージ</h2>
