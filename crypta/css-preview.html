      <div class="zone-tags"><span class="zone-tag zone-tag-alice" data-zone="alice" style="left: 240px; max-width: 468px;">Alice のゾーン</span><span class="zone-tag zone-tag-public" data-zone="public" style="left: 640px; max-width: 308px;">公開ゾーン（誰でも見られる）</span><span class="zone-tag zone-tag-bob" data-zone="bob" style="left: 1040px; max-width: 468px;">Bob のゾーン</span></div></div></div></section><section class="g-section"><h2 class="g-title">事件の見出しと、説明</h2><div class="g-row"><div class="g-item g-static"><div class="g-label">事件: 大きな見出し（はじまり）</div><div class="demo-banner" role="status"><p class="demo-banner-tag">事件</p><h2>書き換えられても、気づけない</h2><p class="demo-banner-line">Mallory が、公開ゾーンで、写真を書き換えます。Bob は、気づけるでしょうか。</p></div></div><div class="g-item g-static"><div class="g-label">事件: 大きな見出し（結果）</div><div class="demo-banner is-bad" role="status"><p class="demo-banner-tag">事件の結果</p><h2>破られた</h2><p class="demo-banner-line">完全性: Mallory の「改ざん」に気づけず、Bob は壊れた（意味のない）データを受け入れてしまいました。届いたものを検証する部品（ハッシュ・MAC・署名など）が、Bob の側にありません。暗号化だけでは、書き換えには気づけません。</p></div></div></div><div class="g-item g-static"><div class="g-label">事件の説明（スライド）</div><div class="guide-card"><div class="guide-head"><h2>事件: 書き換えられても、気づけない（1 / 5）</h2></div><div class="guide-body"><p class="demo-verdict is-bad">いまの回路は、破られました</p><section class="guide-section"><h3>現実では</h3><p>通信の途中で、データを書き換えられると、受け取った側は、偽物に気づけません。お金の金額や、送り先が、変えられる危険があります。</p></section><section class="guide-section"><h3>起きたこと</h3><p>Bob は、書き換えられた写真を、そのまま受け取りました。</p><p class="demo-reason">（完全性: Mallory の「改ざん」に気づけず、Bob は壊れた（意味のない）データを受け入れてしまいました。届いたものを検証する部品（ハッシュ・MAC・署名など）が、Bob の側にありません。暗号化だけでは、書き換えには気づけません。）</p></section></div><div class="guide-foot"><button class="button button-primary" type="button">次へ</button></div></div></div></section><section class="g-section"><h2 class="g-title">結果</h2><p class="g-note">成功と、失敗。</p><div class="g-row"><div class="g-item "><div class="g-label">結果（成功）</div><section class="result is-safe" id="result" aria-live="polite" tabindex="-1"><div class="result-head"><h2 class="result-title">守り切った！</h2><span class="rating rating-S" aria-label="評価 S">S</span><button class="result-close" type="button" aria-label="結果を閉じる">×</button></div><p class="result-flow">Alice  →  MACを付ける  →  暗号化（AES）  →  復号（AES）  →  MACを照合  →  Bob</p><div class="result-scenes"><p class="is-ok">本物の通信: Bob に「PHOTO.JPG」が、ちゃんと届きました。</p><p class="is-ok">攻撃された通信（2回）: 2回は、Bob が見抜いて拒否</p></div><div class="result-objectives"><div class="result-objective is-met"><h3><span>本編</span><span>達成</span></h3><div class="check-list"><div class="check-item is-met"><strong>Bob にメッセージが届く</strong><p>Bob は元のメッセージを読めました。</p></div><div class="check-item is-met"><strong>機密性</strong><p>攻撃者は暗号文を手に入れましたが、「AES」を破れませんでした（攻撃者: 計算能力が低い）。</p></div><div class="check-item is-met"><strong>完全性</strong><p>Mallory の「改ざん」は、「MACを照合」で見抜かれ、Bob は拒否しました。 Mallory の「なりすまし」は、「MACを照合」で見抜かれ、Bob は拒否しました。</p></div><div class="check-item is-met"><strong>真正性</strong><p>Mallory の「なりすまし」は、「MACを照合」で見抜かれ、Bob は拒否しました。</p></div></div></div></div><div class="attack-info"><h4>Mallory の攻撃のようす</h4><ul class="attack-list"><li class="attack-item is-good">Mallory の「改ざん」は、「MACを照合」で見抜かれ、Bob は拒否しました。</li><li class="attack-item is-good">Mallory の「なりすまし」は、「MACを照合」で見抜かれ、Bob は拒否しました。</li></ul></div><div class="explain"><h4>解説</h4><p class="explain-learned"><strong>分かったこと</strong>鍵を知らない <button class="term" type="button" data-term="mallory" title="Mallory（マロリー）: 通信に手を出す攻撃者。書き換え・なりすまし・再送をします。（クリックでくわしく）">Mallory</button> には、正しい <button class="term" type="button" data-term="mac" title="MAC（メッセージ認証符号）: 共通鍵を使って作る、鍵つきの指紋。（クリックでくわしく）">MAC</button> を作れませんでした。</p><p class="explain-question"><strong>次に考えたいこと</strong>Alice が「送っていない」と言い張ったら？</p></div><div class="result-note rating-note"><strong>無駄がなく、想定解と同じ数の部品で、すべての条件を満たしました。</strong><small>ペア 3（想定解 3）・パーツ 9（想定解 9）</small></div><p class="result-note">右上の「想定解」で、模範の組み立て方を見られるようになりました。</p><div class="result-actions"><a class="button button-primary" href="simulator.html?stage=stage07">次のステージへ</a><button class="button button-secondary" type="button">もう一度つくる</button><a class="button button-secondary" href="index.html#stage-section">ステージ一覧へ</a></div></section></div><div class="g-item "><div class="g-label">結果（失敗）</div><section class="result is-broken" id="result" aria-live="polite" tabindex="-1"><div class="result-head"><h2 class="result-title">Alice が、言い逃れできてしまう</h2><span class="rating rating-B" aria-label="評価 B">B</span><button class="result-close" type="button" aria-label="結果を閉じる">×</button></div><p class="result-flow">Alice  →  MACを付ける  →  暗号化（AES）  →  復号（AES）  →  MACを照合  →  Bob</p><div class="result-scenes"><p class="is-ok">本物の通信: Bob に「PHOTO.JPG」が、ちゃんと届きました。</p><p class="is-ok">攻撃された通信（2回）: 2回は、Bob が見抜いて拒否</p></div><div class="result-objectives"><div class="result-objective is-unmet"><h3><span>本編</span><span>未達成</span></h3><div class="check-list"><div class="check-item is-unmet"><strong>否認防止</strong><p>Alice は「送っていない」と言い張れます。MAC は、同じ共通鍵を持つ Bob 自身にも作れる印です。Bob が「Alice が送った」と言っても、第三者には、Bob が自分で作ったものかもしれない、と疑われます。</p></div><div class="check-item is-met"><strong>Bob にメッセージが届く</strong><p>Bob は元のメッセージを読めました。</p></div><div class="check-item is-met"><strong>機密性</strong><p>攻撃者は暗号文を手に入れましたが、「AES」を破れませんでした（攻撃者: 計算能力が低い）。</p></div><div class="check-item is-met"><strong>完全性</strong><p>Mallory の「改ざん」は、「MACを照合」で見抜かれ、Bob は拒否しました。 Mallory の「なりすまし」は、「MACを照合」で見抜かれ、Bob は拒否しました。</p></div><div class="check-item is-met"><strong>真正性</strong><p>Mallory の「なりすまし」は、「MACを照合」で見抜かれ、Bob は拒否しました。</p></div></div></div></div><div class="attack-info"><h4>Mallory の攻撃のようす</h4><ul class="attack-list"><li class="attack-item is-good">Mallory の「改ざん」は、「MACを照合」で見抜かれ、Bob は拒否しました。</li><li class="attack-item is-good">Mallory の「なりすまし」は、「MACを照合」で見抜かれ、Bob は拒否しました。</li></ul></div><div class="explain is-hint"><h4>ヒント</h4><ul><li><button class="term" type="button" data-term="signature" title="デジタル署名: 秘密鍵で押す、本人にしか作れない印。（クリックでくわしく）">署名</button>は、Alice の<button class="term" type="button" data-term="publickey" title="公開鍵と秘密鍵: 2つで1組の鍵。公開鍵は誰に見せてもよく、秘密鍵は持ち主だけが持つ。（クリックでくわしく）">秘密鍵</button>で作ります。Alice の鍵ペアは、Alice の<button class="term" type="button" data-term="channel" title="ゾーンと公開ゾーン: 画面は3つのゾーンに分かれている。真ん中の「公開ゾーン」は、誰でも見られる場所。（クリックでくわしく）">ゾーン</button>に置きます。</li><li><button class="term" type="button" data-term="mac" title="MAC（メッセージ認証符号）: 共通鍵を使って作る、鍵つきの指紋。（クリックでくわしく）">MAC</button> は、<button class="term" type="button" data-term="signature" title="デジタル署名: 秘密鍵で押す、本人にしか作れない印。（クリックでくわしく）">署名</button>があれば、もう要りません。</li></ul></div><div class="result-actions"><button class="button button-secondary" type="button">もう一度つくる</button><a class="button button-secondary" href="index.html#stage-section">ステージ一覧へ</a></div></section></div></div></section><section class="g-section"><h2 class="g-title">解説・通知・案内</h2><div class="g-row"><div class="g-item g-static"><div class="g-label">解説</div><div class="guide-card">
      <div class="guide-head">
        <h2 id="guide-title">偽造</h2>
        <button type="button" class="guide-close" id="guide-close" aria-label="解説を閉じる">×</button>
      </div>
      <div class="guide-body" id="guide-body"><blockquote class="guide-scene"><strong>今送ったその情報、本当に大丈夫？</strong><p>指紋（<button class="term" type="button" data-term="hash" title="ハッシュ関数（ハッシュ値）: データから作る、短い「指紋」。（クリックでくわしく）">ハッシュ</button>）は、誰でも計算できます。</p></blockquote><p class="guide-lead">偽の本文と偽の指紋を、見抜けるようにしよう</p><details class="guide-more"><summary>ほかの部品の使い方</summary><div class="guide-part"><strong>共通鍵</strong><span>暗号をかけたり、ほどいたりするための鍵</span><p>出口を、暗号化・復号・<button class="term" type="button" data-term="mac" title="MAC（メッセージ認証符号）: 共通鍵を使って作る、鍵つきの指紋。（クリックでくわしく）">MAC</button> などの「鍵」の入口につなぎます。Bob の<button class="term" type="button" data-term="channel" title="ゾーンと公開ゾーン: 画面は3つのゾーンに分かれている。真ん中の「公開ゾーン」は、誰でも見られる場所。（クリックでくわしく）">ゾーン</button>の部品につなぐと、その線は公開ゾーンを通るので、攻撃者に見つかる危険があります。</p></div><div class="guide-part"><strong>暗号化</strong><span>データを、読めない形にする</span><p>「データ」に流したい線を、つなぎます。方式を選びます。シーザー・<button class="term" type="button" data-term="aes" title="AES: いま世界中で標準的に使われている共通鍵暗号。（クリックでくわしく）">AES</button> のときは、「鍵」に<button class="term" type="button" data-term="sharedkey" title="共通鍵（共通鍵暗号）: 暗号化と復号に、同じ鍵を使う方式。（クリックでくわしく）">共通鍵</button>を、<button class="term" type="button" data-term="rsa" title="公開鍵暗号（RSA）: 公開鍵で暗号化し、秘密鍵で復号する方式。RSA が代表例。（クリックでくわしく）">RSA</button> のときは、<button class="term" type="button" data-term="publickey" title="公開鍵と秘密鍵: 2つで1組の鍵。公開鍵は誰に見せてもよく、秘密鍵は持ち主だけが持つ。（クリックでくわしく）">公開鍵</button>を、つなぎます。出口から、暗号文が出ます。</p></div><div class="guide-part"><strong>復号</strong><span>読めない形から、元に戻す</span><p>暗号化と同じ方式にします。シーザー・<button class="term" type="button" data-term="aes" title="AES: いま世界中で標準的に使われている共通鍵暗号。（クリックでくわしく）">AES</button> のときは、同じ<button class="term" type="button" data-term="sharedkey" title="共通鍵（共通鍵暗号）: 暗号化と復号に、同じ鍵を使う方式。（クリックでくわしく）">共通鍵</button>を、<button class="term" type="button" data-term="rsa" title="公開鍵暗号（RSA）: 公開鍵で暗号化し、秘密鍵で復号する方式。RSA が代表例。（クリックでくわしく）">RSA</button> のときは、<button class="term" type="button" data-term="publickey" title="公開鍵と秘密鍵: 2つで1組の鍵。公開鍵は誰に見せてもよく、秘密鍵は持ち主だけが持つ。（クリックでくわしく）">公開鍵</button>とペアの、秘密鍵を、「鍵」につなぎます。どちらかが違うと、意味のないデータになります。</p></div><div class="guide-part"><strong>Bob の鍵ペア</strong><span>公開鍵（公開ゾーン）と秘密鍵（Bob のゾーン）</span><p>2つ1組で置かれます。<button class="term" type="button" data-term="publickey" title="公開鍵と秘密鍵: 2つで1組の鍵。公開鍵は誰に見せてもよく、秘密鍵は持ち主だけが持つ。（クリックでくわしく）">秘密鍵</button>は、Bob の<button class="term" type="button" data-term="channel" title="ゾーンと公開ゾーン: 画面は3つのゾーンに分かれている。真ん中の「公開ゾーン」は、誰でも見られる場所。（クリックでくわしく）">ゾーン</button>の中だけ、公開鍵は、まん中の公開ゾーンの中だけに、置けます。同じ印の2つは、ペアです。公開鍵で閉じたものは、秘密鍵でしか開けられません。</p></div><div class="guide-part"><strong>Alice の鍵ペア</strong><span>公開鍵（公開ゾーン）と秘密鍵（Alice のゾーン）</span><p>2つ1組で置かれます。<button class="term" type="button" data-term="publickey" title="公開鍵と秘密鍵: 2つで1組の鍵。公開鍵は誰に見せてもよく、秘密鍵は持ち主だけが持つ。（クリックでくわしく）">秘密鍵</button>は、Alice の<button class="term" type="button" data-term="channel" title="ゾーンと公開ゾーン: 画面は3つのゾーンに分かれている。真ん中の「公開ゾーン」は、誰でも見られる場所。（クリックでくわしく）">ゾーン</button>の中だけ、公開鍵は、まん中の公開ゾーンの中だけに、置けます。同じ印の2つは、ペアです。公開鍵で閉じたものは、秘密鍵でしか開けられません。</p></div><div class="guide-part"><strong>ハッシュを付ける</strong><span>データの「指紋」を添える</span><p>データを通すと、データの「指紋（<button class="term" type="button" data-term="hash" title="ハッシュ関数（ハッシュ値）: データから作る、短い「指紋」。（クリックでくわしく）">ハッシュ値</button>）」が添えられて出てきます。</p></div><div class="guide-part"><strong>ハッシュを照合</strong><span>指紋が合うか、確かめる</span><p>Bob の側に置きます。届いたデータの指紋を計算し直して、添えられた指紋と比べます。違うと拒否します。</p></div><div class="guide-part"><strong>MACを付ける</strong><span>鍵を持つ人だけが作れる指紋を添える</span><p>「データ」と「<button class="term" type="button" data-term="sharedkey" title="共通鍵（共通鍵暗号）: 暗号化と復号に、同じ鍵を使う方式。（クリックでくわしく）">共通鍵</button>」をつなぐと、鍵つきの指紋（<button class="term" type="button" data-term="mac" title="MAC（メッセージ認証符号）: 共通鍵を使って作る、鍵つきの指紋。（クリックでくわしく）">MAC</button>）が添えられて出てきます。</p></div><div class="guide-part"><strong>MACを照合</strong><span>同じ鍵で、指紋を確かめる</span><p>Bob の側に置きます。同じ<button class="term" type="button" data-term="sharedkey" title="共通鍵（共通鍵暗号）: 暗号化と復号に、同じ鍵を使う方式。（クリックでくわしく）">共通鍵</button>をつなぐと、<button class="term" type="button" data-term="mac" title="MAC（メッセージ認証符号）: 共通鍵を使って作る、鍵つきの指紋。（クリックでくわしく）">MAC</button> を計算し直して比べます。違うと拒否します。</p></div></details></div>
      <div class="guide-foot">
        <button type="button" class="button button-primary" id="guide-start">あそぶ</button>
      </div>
    </div></div><div class="g-item g-static"><div class="g-label">通知（トースト）</div><div class="toast is-note" id="toast" role="status" aria-live="polite">想定解: ハッシュを、MAC に替えます。MAC の鍵は、暗号化に使う共通鍵です。Bob は、公開鍵で包まれた鍵から、MAC の鍵を取り出します。　（「シミュレーション開始」で、確かめられます）</div></div><div class="g-item g-static"><div class="g-label">チュートリアルの案内</div><div class="coach" id="coach" role="status" aria-live="polite">
        <p class="coach-step" id="coach-step">ステップ 1 / 4</p>
        <p class="coach-text" id="coach-text">まずは、ブロックの動かし方。「Alice」と書いてある部分をつかんで、好きな場所へドラッグしてみよう（Alice は、自分のゾーンの中だけ動かせるよ）。</p>
      </div></div></div></section></script>
<script type="text/plain" id="page-glo"><section class="g-section"><h2 class="g-title">用語集（実物）</h2><header class="site-header">

  </header><main class="glossary-main">
    <h1>用語集</h1>
    <p class="glossary-lead">
      暗号やセキュリティの言葉の説明です。ステージを進めると、新しい用語が読めるようになります。
    </p>

    <div class="glossary-layout">

        <div id="glossary-nav-list"><section class="nav-group"><h2>キャラクター</h2><ul class="nav-items"><li data-id="alice-bob" data-search="aliceとbob 通信をする2人。alice が送り、bob が受け取ります。 aliceとbob"><a class="nav-item" href="#alice-bob">AliceとBob</a></li><li data-id="eve" data-search="eve（イブ） こっそり通信を盗み見る攻撃者。 eve"><a class="nav-item" href="#eve">Eve（イブ）</a></li><li data-id="mallory" data-search="mallory（マロリー） 通信に手を出す攻撃者。書き換え・なりすまし・再送をします。 mallory"><a class="nav-item" href="#mallory">Mallory（マロリー）</a></li><li data-id="channel" data-search="ゾーンと公開ゾーン 画面は3つのゾーンに分かれている。真ん中の「公開ゾーン」は、誰でも見られる場所。 公開ゾーン ゾーン"><a class="nav-item" href="#channel">ゾーンと公開ゾーン</a></li></ul></section><section class="nav-group"><h2>暗号のしくみ</h2><ul class="nav-items"><li data-id="plaintext" data-search="平文と暗号文 暗号化する前の読めるデータが平文、暗号化したあとが暗号文。 平文と暗号文"><a class="nav-item" href="#plaintext">平文と暗号文</a></li><li data-id="encryption" data-search="暗号化と復号 データを読めない形に変えるのが暗号化、元に戻すのが復号。 暗号化と復号"><a class="nav-item" href="#encryption">暗号化と復号</a></li><li data-id="caesar" data-search="シーザー暗号 アルファベットを決まった数だけずらす、いちばん単純な暗号。 シーザー暗号 caesar"><a class="nav-item" href="#caesar">シーザー暗号</a></li><li data-id="substitution" data-search="単一換字式暗号 アルファベットを1文字ずつ別の文字に入れ替える暗号。 単一換字式暗号 換字式暗号 換字式"><a class="nav-item" href="#substitution">単一換字式暗号</a></li><li data-id="enigma" data-search="エニグマ 歯車で変換ルールが毎回変わる、第二次世界大戦で使われた暗号機。 エニグマ enigma"><a class="nav-item" href="#enigma">エニグマ</a></li><li data-id="aes" data-search="aes いま世界中で標準的に使われている共通鍵暗号。 aes"><a class="nav-item is-current" href="#aes">AES</a></li><li data-id="rsa" data-search="公開鍵暗号（rsa） 公開鍵で暗号化し、秘密鍵で復号する方式。rsa が代表例。 公開鍵暗号 rsa"><a class="nav-item" href="#rsa">公開鍵暗号（RSA）</a></li><li data-id="hybrid" data-search="ハイブリッド暗号 本文は共通鍵暗号（速い）、その鍵は公開鍵暗号（安全に渡せる）で守る方式。 ハイブリッド暗号"><a class="nav-item" href="#hybrid">ハイブリッド暗号</a></li></ul></section><section class="nav-group"><h2>鍵</h2><ul class="nav-items"><li data-id="key" data-search="鍵 暗号化・復号に使う「秘密の値」。 "><a class="nav-item" href="#key">鍵</a></li><li data-id="sharedkey" data-search="共通鍵（共通鍵暗号） 暗号化と復号に、同じ鍵を使う方式。 共通鍵暗号 共通鍵"><a class="nav-item" href="#sharedkey">共通鍵（共通鍵暗号）</a></li><li data-id="publickey" data-search="公開鍵と秘密鍵 2つで1組の鍵。公開鍵は誰に見せてもよく、秘密鍵は持ち主だけが持つ。 公開鍵 秘密鍵"><a class="nav-item" href="#publickey">公開鍵と秘密鍵</a></li><li data-id="keybits" data-search="鍵の長さ（ビット） 鍵が何通りあるかを表す数。ビットが1つ増えると、候補が2倍になる。 鍵の長さ 512ビット 2048ビット"><a class="nav-item" href="#keybits">鍵の長さ（ビット）</a></li><li data-id="pubsafe" data-search="なぜ公開鍵は、盗まれても使えないの？ 公開鍵は「閉じる」専用。開けるには、ペアの秘密鍵が必要だから。 "><a class="nav-item" href="#pubsafe">なぜ公開鍵は、盗まれても使えないの？</a></li><li data-id="handkey" data-search="手渡しの鍵（2つ1組） 会って、直接渡した鍵。alice と bob のゾーンに、同じ印の鍵が、1つずつ置かれる。 手渡しの鍵 手渡し"><a class="nav-item" href="#handkey">手渡しの鍵（2つ1組）</a></li></ul></section><section class="nav-group"><h2>攻撃</h2><ul class="nav-items"><li data-id="bruteforce" data-search="総当たり攻撃（ブルートフォース） ありうる鍵を、全部順番に試す攻撃。 総当たり攻撃 総当たり ブルートフォース"><a class="nav-item" href="#bruteforce">総当たり攻撃（ブルートフォース）</a></li><li data-id="frequency" data-search="頻度分析 文字の出現回数の偏りから、暗号を推理して解く方法。 頻度分析"><a class="nav-item" href="#frequency">頻度分析</a></li><li data-id="keydist" data-search="鍵配送問題 共通鍵を、どうやって相手に安全に届けるかという問題。 鍵配送問題"><a class="nav-item" href="#keydist">鍵配送問題</a></li><li data-id="mitm" data-search="中間者攻撃 aliceとbobの間に入り込んで、双方になりすます攻撃。 中間者攻撃"><a class="nav-item" href="#mitm">中間者攻撃</a></li><li data-id="replay" data-search="リプレイ攻撃（再送） 過去の本物の通信を取っておいて、あとで送り直す攻撃。 リプレイ攻撃 リプレイ 再送"><a class="nav-item" href="#replay">リプレイ攻撃（再送）</a></li></ul></section><section class="nav-group"><h2>確かめるしくみ</h2><ul class="nav-items"><li data-id="hash" data-search="ハッシュ関数（ハッシュ値） データから作る、短い「指紋」。 ハッシュ関数 ハッシュ値 ハッシュ"><a class="nav-item" href="#hash">ハッシュ関数（ハッシュ値）</a></li><li data-id="mac" data-search="mac（メッセージ認証符号） 共通鍵を使って作る、鍵つきの指紋。 メッセージ認証符号 mac"><a class="nav-item" href="#mac">MAC（メッセージ認証符号）</a></li><li data-id="signature" data-search="デジタル署名 秘密鍵で押す、本人にしか作れない印。 デジタル署名 署名"><a class="nav-item" href="#signature">デジタル署名</a></li><li data-id="certificate" data-search="デジタル証明書 「この公開鍵は、確かにこの人のもの」という、ca の保証書。 デジタル証明書 証明書"><a class="nav-item" href="#certificate">デジタル証明書</a></li><li data-id="ca" data-search="ca（認証局）とルート ca 公開鍵が本物だと保証してくれる、信頼できる第三者。 ルートca ルート ca 認証局 ca"><a class="nav-item" href="#ca">CA（認証局）とルート CA</a></li><li data-id="pki" data-search="pki（公開鍵基盤） 証明書によって、公開鍵を信頼できるようにする、社会的な仕組み全体。 pki 公開鍵基盤"><a class="nav-item" href="#pki">PKI（公開鍵基盤）</a></li><li data-id="seqnum" data-search="通し番号 「何番目の通信か」を添えて、再送を見抜くための番号。 通し番号"><a class="nav-item" href="#seqnum">通し番号</a></li></ul></section><section class="nav-group"><h2>通信全体を守るしくみ</h2><ul class="nav-items"><li data-id="tls" data-search="tls / https web などの通信を、まとめて安全にする標準の仕組み。 tls https"><a class="nav-item" href="#tls">TLS / HTTPS</a></li></ul></section><section class="nav-group"><h2>守りたいこと</h2><ul class="nav-items"><li data-id="confidentiality" data-search="機密性 盗み見されても、内容が分からないこと。 機密性"><a class="nav-item" href="#confidentiality">機密性</a></li><li data-id="integrity" data-search="完全性 途中で書き換えられていないこと。書き換えられたら気づけること。 完全性"><a class="nav-item" href="#integrity">完全性</a></li><li data-id="authenticity" data-search="真正性（認証） 本当にその人（やその鍵）から来た通信だと、確かめられること。 真正性 認証"><a class="nav-item" href="#authenticity">真正性（認証）</a></li><li data-id="nonrepudiation" data-search="否認防止 あとから「私は送っていない」と言い逃れできないこと。 否認防止"><a class="nav-item" href="#nonrepudiation">否認防止</a></li><li data-id="freshness" data-search="新鮮さ（再送防止） 過去の通信の使い回しを、受け付けないこと。 新鮮さ"><a class="nav-item" href="#freshness">新鮮さ（再送防止）</a></li></ul></section><section class="nav-group"><h2>攻撃者の環境</h2><ul class="nav-items"><li data-id="env" data-search="攻撃者の「環境」とは？ 攻撃者が、どんな情報を持っていて、どれくらい通信を見られて、どんな計算ができるのかをまとめたもの。 "><a class="nav-item" href="#env">攻撃者の「環境」とは？</a></li><li data-id="env-compute" data-search="計算能力 攻撃者が、どれくらい大量の計算をできるか。 計算能力"><a class="nav-item" href="#env-compute">計算能力</a></li><li data-id="env-seek" data-search="探すもの 攻撃者が、公開ゾーンで、何を探すか。メッセージだけか、鍵も探すか。 探すもの"><a class="nav-item" href="#env-seek">探すもの</a></li><li data-id="env-attacks" data-search="できる攻撃（介入範囲） mallory が、通信にどこまで手を加えられるか。 "><a class="nav-item" href="#env-attacks">できる攻撃（介入範囲）</a></li></ul></section><section class="nav-group"><h2>ゲームのルール</h2><ul class="nav-items"><li data-id="objective" data-search="最終目標と、目標 a・b まず a を目指し、そのあと、より厳しい b に挑戦します。 "><a class="nav-item" href="#objective">最終目標と、目標 A・B</a></li><li data-id="rating" data-search="評価（s・a・b・c） 必要なことを守れているか、無駄がないかで決まります。 "><a class="nav-item" href="#rating">評価（S・A・B・C）</a></li></ul></section></div>

      <article class="glossary-detail" id="glossary-detail" tabindex="-1"><p class="detail-cat">暗号のしくみ</p><h2 class="detail-title">AES</h2><p class="detail-lead">いま世界中で標準的に使われている<a class="term-link" href="#sharedkey">共通鍵暗号</a>。</p><section class="detail-section"><h3>AES とは？</h3><p>Advanced Encryption Standard（高度暗号化標準）の略で、2001年にアメリカの標準暗号に選ばれた<a class="term-link" href="#sharedkey">共通鍵暗号</a>です。いまでは、<a class="term-link" href="#tls">HTTPS</a>（Web）、Wi-Fi（WPA2 など）、スマホやパソコンのデータ保護など、身の回りのいたるところで使われています。</p></section><section class="detail-section"><h3>こんな場面で考えてみよう</h3><p>ネットバンクで、送金の手続きをします。暗証番号や金額は、通信の途中で、AES で暗号化されています。この暗号は、本当に、破られないのでしょうか？</p></section><section class="detail-section"><h3>しくみ</h3><p>データを、16バイト（128ビット）の「ブロック」に区切ります。そのブロックに、「置き換え」「並べ替え」「混ぜ合わせ」「鍵を加える」の4つの操作を、何ラウンドも繰り返します。ラウンド数は、鍵が128ビットなら10回、256ビットなら14回です。</p><pre class="detail-code">平文を 16 バイトずつのブロックに分ける
  ↓ ラウンド1: 置き換え → 並べ替え → 混ぜ合わせ → 鍵を加える
  ↓ ラウンド2: 同じ操作を、ラウンドごとに別の鍵で
  ↓ …（10〜14 ラウンド）
暗号文</pre></section><section class="detail-section"><h3>なぜ、エニグマのようにならない？</h3><p>何度も何度も混ぜるので、文字の偏りも、規則性も、残りません。また、仕組みの強さを、数学的に評価できるように設計されていて、世界中の研究者が、何年も弱点を探し続けてきました。それでも、実用的な弱点は、見つかっていません。</p></section><section class="detail-section"><h3>どれくらい強い？</h3><p>鍵が128ビットなら、鍵の候補は、約 3.4×10³⁸ 通りです。1秒に1京（10¹⁶）通り試せる、夢のような機械があっても、すべてを試すのに、約 10¹⁵ 年（宇宙の年齢の約8万倍）かかります。</p></section><section class="detail-section"><h3>それでも残る不安</h3><p>・鍵が盗まれたら、一瞬で復号されます。AES の強さは、「鍵が秘密であること」が前提です。
・鍵を、どうやって相手に渡すのか（<a class="term-link" href="#keydist">鍵配送問題</a>）。
・暗号化だけでは、書き換えには気づけません。
・暗号化した本人が、うっかり弱い鍵（短いパスワードなど）を使うと、<a class="term-link" href="#bruteforce">総当たり</a>で破られます。</p></section><section class="detail-see"><h3>あわせて読む</h3><div class="see-chips"><a class="see-chip" href="#sharedkey">共通鍵（共通鍵暗号）</a><a class="see-chip" href="#keydist">鍵配送問題</a><a class="see-chip" href="#bruteforce">総当たり攻撃（ブルートフォース）</a><a class="see-chip" href="#hybrid">ハイブリッド暗号</a></div></section></article>
    </div>

const $ = (s) => document.querySelector(s);
const ta = $('#css');
const initial = ta.value;
const base = (id) => document.getElementById(id).textContent.replace(/<\\\/script/g, '</script');
const frames = [];
let width = 1280;

function srcdoc(p, live) {
  const css = p.css.map((n) => base('css-' + n)).join('\n');
  return '<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">'
    + '<style>' + css + '</style><style id="live">' + live + '</style><style id="gallery">' + GALLERY_CSS + '</style></head>'
    + '<body class="' + p.body + '">' + base('page-' + p.id) + '</body></html>';

PAGES.forEach((p) => {
  const box = document.createElement('div'); box.className = 'pv';
  box.innerHTML = '<h2>' + p.title + '</h2>';
  const f = document.createElement('iframe'); f.setAttribute('title', p.title); f.style.height = '400px';
  box.append(f); $('#preview').append(box); frames.push({ f, p, box });
  f.srcdoc = srcdoc(p, ta.value);
  f.addEventListener('load', () => {
    const d = f.contentDocument;
    fit(f);
    new ResizeObserver(() => fit(f)).observe(d.documentElement);
    d.addEventListener('click', (e) => {
      e.preventDefault();
      let el = e.target; const path = [];
      for (let i = 0; el && el.nodeType === 1 && el !== d.body && i < 4; i++, el = el.parentElement) {
        const cls = [...el.classList].filter((c) => !/^is-/.test(c)).map((c) => '.' + c).join('');
        path.push(el.tagName.toLowerCase() + cls);
      }
      $('#picked').textContent = path.join('  ←  ');
      // CSS の中で、その部品のクラスが、最初に出てくる場所を、選ぶ
      const first = [...e.target.classList].map((c) => '.' + c);
      for (const sel of first.concat([...(e.target.parentElement?.classList ?? [])].map((c) => '.' + c))) {
        const i = ta.value.indexOf(sel);
        if (i >= 0) { ta.focus(); ta.setSelectionRange(i, i + sel.length); const line = ta.value.slice(0, i).split('\n').length; ta.scrollTop = Math.max(0, (line - 4) * 20); break; }
      }
    }, true);
  });
});

function fit(f) { try { f.style.height = f.contentDocument.documentElement.scrollHeight + 'px'; } catch (e) {} }
function setWidth(w) {
  width = w;
  document.querySelectorAll('.bar [data-w]').forEach((b) => b.classList.toggle('on', Number(b.dataset.w) === w));
  frames.forEach(({ box }) => { box.style.width = w ? Math.min(w, 4000) + 'px' : 'auto'; box.style.maxWidth = '100%'; });
  setTimeout(() => frames.forEach(({ f }) => fit(f)), 60);
}
let timer;
function apply() {
  clearTimeout(timer);
  timer = setTimeout(() => {
    frames.forEach(({ f }) => { const s = f.contentDocument?.getElementById('live'); if (s) s.textContent = ta.value; fit(f); });
    $('#status').textContent = '反映しました（' + new Date().toLocaleTimeString() + '）';
  }, 120);
}
ta.addEventListener('input', apply);
document.querySelectorAll('.bar [data-w]').forEach((b) => b.addEventListener('click', () => setWidth(Number(b.dataset.w))));
$('#reset').addEventListener('click', () => { ta.value = initial; apply(); });
$('#copy').addEventListener('click', async () => { try { await navigator.clipboard.writeText(ta.value); $('#status').textContent = 'コピーしました。css/theme.css に、貼り付けてください。'; } catch (e) { ta.select(); document.execCommand('copy'); } });
$('#save').addEventListener('click', () => {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([ta.value], { type: 'text/css' })); a.download = 'theme.css'; a.click();
  $('#status').textContent = 'theme.css を保存しました。css/theme.css を、置き換えてください。';
});
$('#load').addEventListener('change', async (e) => { const f = e.target.files[0]; if (f) { ta.value = await f.text(); apply(); } });
setWidth(1280);
</script>
</body>
</html>
