<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CRYPTA | セリフ・名前の編集（管理者用）</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/admin.css">
  <link rel="stylesheet" href="css/dialogue-editor.css">
</head>
<body class="page-editor">
  <header class="site-header">
    <a class="site-logo" href="index.html" aria-label="CRYPTA トップへ">CRYPTA</a>
    <div class="site-header-right">
      <span class="de-tag">管理者用: セリフ・名前の編集</span>
      <a class="header-link" href="index.html">トップへ</a>
    </div>
  </header>

  <div class="de-bar">
    <div class="de-tabs" role="tablist">
      <button type="button" class="de-tab is-active" data-tab="dialogue" role="tab">セリフ</button>
      <button type="button" class="de-tab" data-tab="names" role="tab">名前</button>
    </div>
    <input type="search" id="search" class="de-search" placeholder="さがす（セリフ・説明・場所）" aria-label="さがす">
    <span class="de-count" id="changed" role="status"></span>
    <span class="de-sp"></span>
    <button type="button" class="button button-secondary button-quiet" id="try">ゲームで試す</button>
    <button type="button" class="button button-secondary button-quiet" id="untry">試しを解除</button>
    <button type="button" class="button button-secondary button-quiet" id="copy">コピー</button>
    <label class="button button-secondary button-quiet de-file">読み込む<input type="file" id="load" accept=".json,application/json" hidden></label>
    <button type="button" class="button button-secondary button-quiet" id="revert">全部、元に戻す</button>
    <button type="button" class="button button-primary button-quiet" id="save">保存（ダウンロード）</button>
  </div>

  <p class="de-status" id="status" role="status">読み込み中…</p>

  <div class="de-layout">
    <nav class="de-nav" id="nav" aria-label="グループ"></nav>
    <main class="de-main">
      <div id="panel-dialogue"></div>
      <div id="panel-names" hidden></div>
    </main>
  </div>

  <script type="module" src="js/dialogue-editor.js"></script>
</body>
</html>
